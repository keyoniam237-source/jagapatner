<title>Jaga Toko — Semua Toko, Satu Aplikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#0a1633; --ink-2:#22304f; --muted:#66728a; --line:#e3e8f1;
  --brand:#0a1633; --brand-2:#050c1f; --lime:#2f6bff; --lime-2:#1f56e6; --sky:#7cc2ff; --brand-soft:#e6efff; --mint:#16a37a;
  --accent:#2f6bff; --accent-soft:#eef4ff;
  --danger:#e5484d; --danger-soft:#fdecec; --info:#3d63dd; --info-soft:#eaf0fe; --warn:#b26a00; --warn-soft:#fff3dc;
  --r:22px; --shadow:0 1px 0 rgba(0,0,0,.03),0 12px 32px -12px rgba(15,20,18,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1400px 800px at 95% -25%,rgba(110,160,255,.26) 0%,rgba(110,160,255,.12) 35%,rgba(110,160,255,0) 70%),radial-gradient(1200px 800px at -15% -5%,rgba(130,205,255,.22) 0%,rgba(130,205,255,.08) 40%,rgba(130,205,255,0) 72%),linear-gradient(180deg,#f6f9fe 0%,#f2f5fb 100%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
::selection{background:#cfe0ff}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:12px;z-index:20;padding:0 12px}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px;background:rgba(255,255,255,.72);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 8px 30px -14px rgba(0,0,0,.18);padding:0 10px 0 14px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;white-space:nowrap;color:#0f1b2d}
.jmark{height:36px;width:auto;display:block}
.lsep{width:1px;height:30px;background:currentColor;opacity:.35}
.logo .wm{font-family:Montserrat,'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:19px;letter-spacing:.24em;line-height:1}
.logo .wm b{font-weight:300;color:#b08d4f}
body.is-seller .logo .wm b{color:#d9bb82}
.nav{display:flex;gap:2px;margin-left:auto;background:#edf1f8;padding:4px;border-radius:14px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);position:relative;transition:.15s}
.nav button:hover{color:var(--ink)}
.nav button.on{background:#fff;color:#1f4fd1;box-shadow:0 2px 8px -2px rgba(0,0,0,.12)}
.nav .badge{position:absolute;top:1px;right:1px;background:var(--lime);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px}
.bottomnav{display:none}
main{padding:26px 0 110px}
.notice{background:var(--warn-soft);border:1px solid #f5dfb3;color:#7a4c00;padding:11px 15px;border-radius:14px;font-size:13px;margin-bottom:16px;font-weight:500}
/* hero bento */
.bento{display:grid;grid-template-columns:1.7fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;margin-bottom:22px}
.hero{grid-row:span 2;background:radial-gradient(130% 120% at 100% 0%,#2a5ccc 0%,#1d438f 28%,#142f68 55%,#0d1f48 80%,#0b1a3d 100%);color:#fff;border-radius:28px;padding:34px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:330px}
.hero::before{content:"";position:absolute;width:620px;height:620px;right:-220px;top:-280px;background:radial-gradient(circle,rgba(120,190,255,.38) 0%,rgba(120,190,255,.16) 35%,rgba(120,190,255,0) 70%);filter:blur(40px)}
.hero::after{content:"";position:absolute;width:520px;height:520px;left:-200px;bottom:-300px;background:radial-gradient(circle,rgba(99,102,241,.28) 0%,rgba(99,102,241,.1) 40%,rgba(99,102,241,0) 70%);filter:blur(40px)}
.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:6px 12px 6px 8px;border-radius:99px;width:max-content}
.eyebrow i{width:8px;height:8px;border-radius:99px;background:var(--sky);box-shadow:0 0 0 4px rgba(124,194,255,.25)}
.hero h1{margin:18px 0 10px;font-size:44px;letter-spacing:-.045em;line-height:1.02;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7cc2ff,#a8d8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#b4c3e0;max-width:440px}
.hero .search{margin:24px 0 0;background:#fff;border-radius:16px;padding:6px;display:flex;gap:6px}
.hero .search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;outline:none;color:var(--ink)}
.hero .search .btn{border-radius:12px}
.tile{border-radius:24px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:158px;position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.tile .k{font-size:38px;font-weight:800;letter-spacing:-.05em;line-height:1}
.tile .d{font-size:13px;color:var(--muted);font-weight:600}
.tile .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#eef3fb}
.tile.lime{background:linear-gradient(150deg,#3a72ff 0%,#4a8aff 40%,#5ea5ff 75%,#74baff 100%);border-color:transparent;color:#fff}
.tile.lime .d{color:#dce9ff}
.tile.lime .ico{background:rgba(255,255,255,.2)}
.tile.cta{cursor:pointer;background:radial-gradient(120% 120% at 100% 0%,#24489a 0%,#183573 40%,#10244f 75%,#0b1a3d 100%);color:#fff;border:0}
.tile.cta .d{color:#a9b8d8}
.tile.cta .ico{background:var(--lime);color:#fff}
.tile.cta:hover .arrow{transform:translate(3px,-3px)}
.arrow{transition:transform .2s;font-size:22px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.sec-head{display:flex;align-items:end;justify-content:space-between;margin:6px 0 14px}
.sec-head h2{margin:0;font-size:24px;letter-spacing:-.035em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.8);padding:9px 15px;border-radius:99px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:13.5px;transition:.15s}
.chip:hover{border-color:#c4cfe2;background:#fff}
.chip.on{background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%);color:#fff;border-color:var(--lime);box-shadow:0 6px 16px -6px rgba(47,107,255,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.store-card{cursor:pointer;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;padding:8px}
.store-card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(15,20,18,.3)}
.store-card .cover{height:120px;border-radius:16px;display:flex;align-items:flex-end;padding:12px;position:relative;overflow:hidden}
.store-card .cover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1px);background-size:14px 14px;opacity:.5}
.store-card .cover>*{position:relative;z-index:1}
.store-card .cover>.live,.store-card .cover>.closed{position:absolute}
.avatar{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.3);flex-shrink:0;letter-spacing:-.03em}
.avatar img{width:100%;height:100%;object-fit:cover}
.store-card .body{padding:12px 8px 8px}
.store-card h3{margin:0 0 3px;font-size:17px;letter-spacing:-.025em}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--brand-soft);color:#1f4fd1}
.tag.gray{background:#eef1f6;color:#4a5670}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.blue{background:var(--info-soft);color:var(--info)}
.closed{position:absolute;top:10px;right:10px}
.live{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;display:flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:9px;background:#22c55e}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:10px}
.empty b{color:var(--ink);font-size:17px}
.btn{border:0;background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4f7fc}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.accent,.btn.lime{background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%);color:#fff;box-shadow:0 10px 24px -10px rgba(59,116,255,.65)}
.btn.accent:hover,.btn.lime:hover{filter:brightness(1.06)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.back{border:0;background:#fff;border:1px solid var(--line);cursor:pointer;color:var(--ink);font-weight:700;padding:7px 13px;border-radius:99px;margin-bottom:14px;font-size:13px}
.store-head{padding:22px;display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.store-head .avatar{width:78px;height:78px;font-size:28px;border-radius:22px}
.store-head h2{margin:0 0 4px;font-size:26px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paylist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.prod{overflow:hidden;display:flex;flex-direction:column;padding:8px;transition:box-shadow .2s}
.prod:hover{box-shadow:0 18px 36px -18px rgba(15,20,18,.3)}
.prod .img{aspect-ratio:1/1;background:linear-gradient(140deg,#f1f5fc,#e4ebf7);border-radius:16px;display:grid;place-items:center;font-size:40px;overflow:hidden}
.prod .img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.prod:hover .img img{transform:scale(1.05)}
.prod .body{padding:10px 6px 4px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod h4{margin:0;font-size:15px;letter-spacing:-.02em}
.price{font-weight:800;font-size:16px;letter-spacing:-.02em}
.qty{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.qty button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:800;font-size:16px}
.qty button:hover{background:#eaf1ff;border-color:#bcd0ff;color:#1f4fd1}
.qty b{min-width:20px;text-align:center}
.cartbar{position:fixed;left:0;right:0;bottom:20px;z-index:15;display:flex;justify-content:center;pointer-events:none;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.cartbar .inner{pointer-events:auto;background:rgba(10,22,51,.94);backdrop-filter:blur(12px);color:#fff;border-radius:20px;padding:10px 10px 10px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 20px 50px -10px rgba(0,0,0,.45);min-width:min(540px,92vw);justify-content:space-between}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.pad{padding:22px}
h2.sec{font-size:26px;margin:0 0 16px;letter-spacing:-.04em}
h3.sub{font-size:16px;margin:0 0 12px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.row.total{border-top:1px dashed #d3dbe8;margin-top:8px;padding-top:14px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.free{color:#1f4fd1;font-weight:800;background:var(--brand-soft);padding:1px 8px;border-radius:7px;font-size:13px}
label.f{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;color:var(--ink-2)}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#f8faff;transition:.15s;outline:none}
.in:focus{border-color:var(--lime);background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.18)}
textarea.in{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;margin-bottom:8px;background:#fff;transition:.15s}
.opt.on{border-color:var(--lime);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.opt input{margin-top:3px;accent-color:var(--lime)}
.line-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.line-item:last-child{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:14px;background:#eef2f9;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.steps{display:flex;gap:5px;margin:18px 0 6px}
.step{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.step .bar{height:6px;border-radius:9px;background:#e4e9f2;margin-bottom:7px}
.step.done .bar{background:linear-gradient(90deg,#3b74ff 0%,#5a9dff 100%)}
.step.done{color:#1f4fd1}
.paybox{background:linear-gradient(160deg,#f8fbff,#edf3fd);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.acct{font-size:26px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.qris{max-width:240px;width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin:10px 0;background:#fff;padding:8px}
.proof{max-width:220px;border-radius:14px;border:1px solid var(--line);display:block;margin-top:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;background:#e6ebf4;padding:4px;border-radius:16px;width:max-content;max-width:100%}
.tab{border:0;background:none;padding:9px 15px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted)}
.tab.on{background:#fff;color:#1f4fd1;box-shadow:0 2px 8px -2px rgba(0,0,0,.14)}
.order{padding:16px 18px;margin-bottom:12px;transition:box-shadow .2s}
.order[data-act]:hover{box-shadow:0 18px 36px -18px rgba(15,20,18,.3)}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px 20px}
.stat:first-child{background:linear-gradient(150deg,#3a72ff 0%,#4a8aff 45%,#6aafff 100%);color:#fff;border-color:transparent}
.stat:first-child .l{color:#dce9ff}
.stat:first-child .v{color:#fff}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.045em;margin-top:6px}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);font-weight:700}
.bars .b i{display:block;width:100%;max-width:38px;background:#c9d8f5;border-radius:10px;min-height:4px}
.bars .b:last-child i{background:var(--lime)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(10,22,51,.45);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:26px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:24px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.96) translateY(10px);opacity:0}}
.toast{position:fixed;left:50%;top:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px 11px 14px;border-radius:14px;z-index:60;font-weight:700;font-size:14px;box-shadow:0 14px 34px -8px rgba(0,0,0,.4);max-width:90vw;display:flex;gap:9px;align-items:center;animation:pop .25s}
.toast::before{content:"";width:8px;height:8px;border-radius:9px;background:var(--sky);flex-shrink:0}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .prev{width:68px;height:68px;border-radius:16px;background:#eef2f9;overflow:hidden;display:grid;place-items:center;color:#9aa6bd;flex-shrink:0;border:1px dashed #c4cfe2}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
input[type=file]{font-size:13px}
input[type=file]::file-selector-button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:700;margin-right:10px;cursor:pointer}
.fieldset{border:1px solid var(--line);border-radius:18px;padding:6px 16px 16px;margin-top:16px}
.fieldset legend{font-weight:800;font-size:13px;padding:4px 10px;background:var(--lime);color:#fff;border-radius:99px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600;font-size:14px}
.check input{accent-color:var(--lime);width:17px;height:17px}
details summary{list-style:none}
@media (max-width:900px){
  .bento{grid-template-columns:1fr 1fr}
  .hero{grid-column:span 2;grid-row:auto;min-height:0}
}
@media (max-width:760px){
  header.top{top:8px;padding:0 8px}
  .nav{display:none}
  .bottomnav{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:rgba(10,22,51,.94);backdrop-filter:blur(14px);border-radius:22px;z-index:30;padding:7px;box-shadow:0 16px 40px -10px rgba(0,0,0,.45);margin-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#8e9cbb;padding:7px 2px;cursor:pointer;position:relative;border-radius:15px}
  .bottomnav button .ic{font-size:21px;display:grid;place-items:center}

.btn.wa{background:linear-gradient(135deg,#1faa5a,#25c26a);box-shadow:0 10px 24px -10px rgba(37,194,106,.6)}
.mcontact{margin-top:14px;font-size:12.5px;color:#9fb3db}
.mperks{display:grid;gap:10px}
.mperks div{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px}
.mperks .ic{grid-row:span 2;font-size:22px;color:#9fd0ff}

.sfoot{margin-top:34px;padding:28px 0 10px;border-top:1px solid #e3e8f1;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;font-size:14px}
.sfoot .fcol{display:flex;flex-direction:column;gap:8px}
.sfoot .fcol b{margin-bottom:2px}
.sfoot a,.sfoot span{color:#45526b;text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:7px}
.sfoot a:hover{color:#2f6bff}
.sfoot .jmark{height:30px}
.sfoot .logo .wm{font-size:16px}
.fcopy{grid-column:1/-1;font-size:12.5px;color:#8a96ad;border-top:1px solid #edf0f5;padding-top:14px}
.mmodal{position:relative;text-align:left}
.mhead{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:26px;color:#fff;background:linear-gradient(135deg,#3b74ff,#5a9dff);margin-bottom:14px}
.mlist{display:grid;gap:8px;margin:14px 0 18px;font-weight:600;font-size:14px}

a.sellbtn{text-decoration:none}

  .mband h2{font-size:23px}
  .sfoot{grid-template-columns:1fr}
  .hide-m{display:none!important}
}

.sharebox{margin-top:16px;border:1.5px solid #bcd0ff;background:linear-gradient(160deg,#f6f9ff,#eaf1ff);border-radius:16px;padding:14px 16px}
.sharebox b .ic{color:#2f6bff;margin-right:4px}
.sharebox p{margin:6px 0 0;font-size:13.5px;color:#45526b}
.sharenote{margin-top:14px;font-size:13px;color:#45526b;background:#f4f7fc;border-radius:12px;padding:10px 12px}
.sharenote .ic{color:#2f6bff}

/* ================= JAGA TOKO — MODE APLIKASI (pembeli) ================= */
body.app{background:#eef2f9}
@media (min-width:600px){ body.app{background:radial-gradient(900px 600px at 85% -10%,rgba(90,150,255,.22),transparent 70%),radial-gradient(800px 600px at 0% 100%,rgba(124,194,255,.18),transparent 70%),#e9eef7;background-attachment:fixed} }
body.app header.top,body.app #cartbar .cartbar{display:none!important}
body.app main{padding:0 0 calc(96px + env(safe-area-inset-bottom))}
body.app #app.wrap{max-width:480px;padding:0;margin:0 auto;background:#f6f8fc;min-height:100vh;position:relative;overflow-x:hidden}
@media (min-width:600px){ body.app #app.wrap{box-shadow:0 0 0 1px rgba(10,22,51,.05),0 30px 80px -30px rgba(10,22,51,.35)} }
body.app .notice{margin:12px 16px;border-radius:14px}
.e3d{width:1em;height:1em;object-fit:contain;display:inline-block;vertical-align:-.15em}
.sec-pad{padding:0 16px}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes shimmer{to{background-position:-200% 0}}
.press{transition:transform .15s}
.press:active{transform:scale(.96)}

/* hero beranda */
.ahero{background:radial-gradient(130% 120% at 100% 0%,#3d7bff 0%,#2a5ccc 35%,#1a3e94 70%,#12306f 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 64px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.ahero::after{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(150,205,255,.35),rgba(150,205,255,0) 70%)}
.ahero>*{position:relative;z-index:1}
.atop{display:flex;align-items:center;gap:11px}
.aav{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;overflow:hidden}
.aloc{flex:1;min-width:0;border:0;background:none;color:#fff;text-align:left;cursor:pointer;padding:0}
.aloc small{display:flex;align-items:center;gap:5px;font-size:12px;opacity:.85;font-weight:600}
.aloc small .e3d{font-size:13px}
.aloc b{display:flex;align-items:center;gap:4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aloc b span{overflow:hidden;text-overflow:ellipsis}
.abell{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);display:grid;place-items:center;cursor:pointer;position:relative;font-size:22px}
.abell .bdg{position:absolute;top:2px;right:0;background:#ff5a5f;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;border:2px solid #2a5ccc}
.ahello{margin:16px 0 12px;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.ahello span{display:block;font-size:13.5px;font-weight:500;opacity:.85;letter-spacing:0;margin-top:3px}
.asearch{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 14px;height:50px;color:#8a96ad;box-shadow:0 12px 30px -12px rgba(5,15,40,.45)}
.asearch input{flex:1;min-width:0;border:0;outline:none;font-size:15px;background:none;color:var(--ink)}
.asearch .e3d{font-size:20px}
.abody{margin-top:-40px;position:relative;z-index:2}

/* banner */
.abanner{margin:0 16px;border-radius:22px;overflow:hidden;position:relative;height:158px;box-shadow:0 18px 40px -22px rgba(10,22,51,.6)}
.abanner .slides{display:flex;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.aslide{flex:0 0 100%;height:100%;display:flex;align-items:center;padding:0 18px 0 20px;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.aslide::before{content:"";position:absolute;width:220px;height:220px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%)}
.aslide .tx{flex:1;position:relative;z-index:1}
.aslide .pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:99px;margin-bottom:8px}
.aslide h3{margin:0 0 6px;font-size:20px;line-height:1.12;letter-spacing:-.03em;font-weight:800}
.aslide p{margin:0;font-size:12px;opacity:.9;max-width:200px}
.aslide .cta{display:inline-block;margin-top:10px;background:#fff;color:#1f4fd1;font-weight:800;font-size:12px;padding:6px 12px;border-radius:99px}
.aslide .art{font-size:92px;position:relative;z-index:1;animation:floaty 3.2s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(0,0,0,.25))}
.aslide.b1{background:linear-gradient(120deg,#1e4fd8 0%,#2f6bff 45%,#4f90ff 80%,#6aaeff 100%)}
.aslide.b2{background:linear-gradient(120deg,#0b1a3d 0%,#16306e 45%,#2552b3 85%,#3a6fe0 100%)}
.aslide.b3{background:linear-gradient(120deg,#0e7490 0%,#0ea5c6 50%,#38bdf8 100%)}
.adots{position:absolute;right:18px;bottom:14px;display:flex;gap:5px;z-index:2}
.adots button{width:7px;height:7px;border-radius:99px;border:0;background:rgba(255,255,255,.5);padding:0;cursor:pointer;transition:.3s}
.adots button.on{width:20px;background:#fff}

/* section */
.ash{display:flex;justify-content:space-between;align-items:center;margin:24px 16px 12px}
.ash h2{margin:0;font-size:18px;letter-spacing:-.025em}
.ash button,.ash a{border:0;background:none;color:#2f6bff;font-weight:700;font-size:13px;cursor:pointer;padding:0}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scroll-padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

/* kategori */
.acat{flex:0 0 auto;width:78px;border:0;background:#fff;border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;box-shadow:0 6px 18px -12px rgba(10,22,51,.35);font-size:11.5px;font-weight:700;color:#334063;transition:transform .2s,background .2s}
.acat .e3d{font-size:40px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.acat:hover .e3d{transform:translateY(-3px) rotate(-6deg) scale(1.08)}
.acat.on{background:linear-gradient(160deg,#3b74ff,#2a5ccc);color:#fff;box-shadow:0 12px 24px -10px rgba(47,107,255,.7)}
.acat.on .e3d{transform:scale(1.1)}

/* pesan lagi */
.again{flex:0 0 auto;width:250px;background:#fff;border-radius:18px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px -12px rgba(10,22,51,.35)}
.again .th{width:54px;height:54px;border-radius:14px;background:linear-gradient(150deg,#f1f6ff,#e3edff);display:grid;place-items:center;font-size:34px;overflow:hidden;flex-shrink:0}
.again .th img:not(.e3d){width:100%;height:100%;object-fit:cover}
.again b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.again small{color:#7a869e;font-size:12px}
.again .rb{width:38px;height:38px;border-radius:12px;border:0;background:#eaf1ff;color:#2f6bff;display:grid;place-items:center;cursor:pointer;font-size:18px;flex-shrink:0}

/* promo */
.deal{flex:0 0 auto;width:270px;height:124px;border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.deal small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.deal b{font-size:24px;letter-spacing:-.03em;line-height:1.05;display:block;margin-top:2px}
.deal .chip2{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.45);padding:5px 10px;border-radius:10px;font-size:11.5px;font-weight:800;width:max-content}
.deal .art{position:absolute;right:-6px;bottom:-8px;font-size:84px;animation:floaty 3.6s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3))}
.deal.d1{background:linear-gradient(130deg,#0b1a3d,#1d3f8f 70%,#2a5ccc)}
.deal.d2{background:linear-gradient(130deg,#2f6bff,#4a8aff 60%,#74baff)}
.deal.d3{background:linear-gradient(130deg,#0e7490,#0ea5c6 60%,#38bdf8)}

/* toko */
.astore{flex:0 0 auto;width:220px;background:#fff;border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px -12px rgba(10,22,51,.35)}
.astore .cv{height:84px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 12px}
.astore .cv .e3d{font-size:46px;position:absolute;right:10px;top:8px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.astore .avatar{width:44px;height:44px;font-size:15px;border-radius:14px;margin-bottom:-26px;border:3px solid #fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.3)}
.astore .bd{padding:30px 12px 12px}
.astore b{font-size:15px;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astore small{font-size:12px;color:#7a869e}
.open{color:#16a34a;font-weight:700}.closedt{color:#e5484d;font-weight:700}

/* produk */
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}
.ap{background:#fff;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 6px 18px -12px rgba(10,22,51,.35);cursor:pointer;display:flex;flex-direction:column}
.ap .im{aspect-ratio:1/1;background:linear-gradient(150deg,#f1f6ff,#e3edff);display:grid;place-items:center;overflow:hidden;position:relative}
.ap .im img:not(.e3d){width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ap:hover .im img:not(.e3d){transform:scale(1.05)}
.ap .im .e3d{font-size:68px;filter:drop-shadow(0 12px 14px rgba(10,22,51,.18))}
.ap .so{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#45526b}
.ap .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.ap .nm{font-size:13.5px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.ap .pr{font-size:16px;font-weight:800;letter-spacing:-.02em}
.ap .st{font-size:11.5px;color:#7a869e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .fo{font-size:10.5px;font-weight:800;color:#1f4fd1;background:#eaf1ff;padding:2px 7px;border-radius:6px;width:max-content}
.fav{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;z-index:2;box-shadow:0 4px 12px -4px rgba(0,0,0,.25);color:#9aa6bd;font-size:17px}
.fav.on{color:#ff4d6d}
.fav.on .ic{fill:#ff4d6d}
.fav.pop{animation:pop .45s}
.addb{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:12px;border:0;background:linear-gradient(135deg,#3b74ff,#5a9dff);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:18px;box-shadow:0 8px 16px -8px rgba(47,107,255,.9)}
.addb:active{transform:scale(.88)}
.ap .bd{padding-right:50px}

/* skeleton */
.sk{background:linear-gradient(90deg,#e8edf6 25%,#f4f7fc 50%,#e8edf6 75%);background-size:200% 100%;animation:shimmer 1.2s infinite linear;border-radius:20px}

/* empty */
.aempty{text-align:center;padding:40px 24px;color:#7a869e}
.aempty .e3d{font-size:84px;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 16px 16px rgba(10,22,51,.15))}
.aempty b{display:block;color:var(--ink);font-size:17px;margin:12px 0 4px}

/* app bar */
.abar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(246,248,252,.92);backdrop-filter:blur(12px)}
.abar h1{margin:0;font-size:17px;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:13px;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px -6px rgba(10,22,51,.3);font-size:20px;flex-shrink:0}

/* bottom nav */
body.app .bottomnav{display:flex!important;position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid #e6ebf3;border-radius:22px 22px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -18px rgba(10,22,51,.3);z-index:40;margin:0}
body.app .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#8a96ad;padding:4px 2px;cursor:pointer;position:relative;border-radius:14px}
body.app .bottomnav button .ic{font-size:22px;display:grid;place-items:center;width:46px;height:30px;border-radius:12px;transition:background .25s,color .25s}
body.app .bottomnav button.on{color:#1f4fd1;background:none}
body.app .bottomnav button.on .ic{background:#e6efff}
body.app .bottomnav button.on .ic .ic{background:none}
body.app .bottomnav .badge{position:absolute;top:0;left:56%;background:#ff4d6d;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px;border:2px solid #fff}
body.app .bottomnav .bump{animation:pop .45s}

/* mini cart */
.mcart{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));z-index:35;background:linear-gradient(120deg,#0b1a3d,#1a3e94);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px -14px rgba(10,22,51,.6);animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.mcart .e3d{font-size:30px}
.mcart .grow b{display:block;font-size:14.5px}
.mcart .grow small{opacity:.75;font-size:12px}
.mcart .btn{padding:10px 14px;border-radius:13px}

/* fly to cart */
.flyghost{position:fixed;z-index:999;pointer-events:none;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.flyghost img{width:100%;height:100%;object-fit:cover}
.flyghost .e3d{font-size:48px;object-fit:contain}

/* produk detail */
.pgal{position:relative;aspect-ratio:1/1;background:linear-gradient(150deg,#eaf1ff,#d9e6ff);display:grid;place-items:center;overflow:hidden}
.pgal img:not(.e3d){width:100%;height:100%;object-fit:cover}
.pgal .e3d{font-size:170px;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 26px 24px rgba(10,22,51,.22))}
.pgal .ibtn{position:absolute;top:calc(12px + env(safe-area-inset-top));z-index:2}
.pgal .ibtn.l{left:12px}.pgal .ibtn.r{right:12px}
.psheet{background:#f6f8fc;border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding:22px 16px 10px}
.psheet h1{font-size:21px;letter-spacing:-.03em;margin:0 0 6px;line-height:1.25}
.psheet .bp{font-size:28px;font-weight:800;letter-spacing:-.04em;margin:8px 0 12px}
.pinfo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;box-shadow:0 4px 12px -8px rgba(10,22,51,.3)}
.pchip .e3d{font-size:18px}
.pcard{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px -14px rgba(10,22,51,.35)}
.pcard h3{margin:0 0 6px;font-size:14.5px}
.pbuy{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);z-index:45;background:#fff;border-radius:22px 22px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;box-shadow:0 -12px 30px -16px rgba(10,22,51,.35)}
.pbuy .stp{display:flex;align-items:center;gap:6px;background:#f1f4fa;border-radius:14px;padding:4px}
.pbuy .stp button{width:34px;height:34px;border-radius:11px;border:0;background:#fff;font-size:18px;font-weight:800;cursor:pointer}
.pbuy .stp b{min-width:22px;text-align:center}
.pbuy .btn{flex:1;padding:14px;border-radius:15px}
body.app.v-product .bottomnav,body.app.v-login .bottomnav,body.is-driver .bottomnav{display:none!important}
body.is-driver main{padding-bottom:calc(30px + env(safe-area-inset-bottom))!important}
body.app.v-product .mcart{display:none}

/* toko */
.scover{padding:calc(14px + env(safe-area-inset-top)) 16px 24px;color:#fff;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.scover .art{position:absolute;right:-14px;top:16px;font-size:96px;opacity:.9;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 16px 16px rgba(0,0,0,.25))}
.scover .ibtn{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.scover .who{display:flex;gap:12px;align-items:center;margin-top:16px;position:relative;z-index:1}
.scover .avatar{width:60px;height:60px;border-radius:18px;font-size:20px;border:3px solid rgba(255,255,255,.6)}
.scover h2{margin:0;font-size:22px;letter-spacing:-.03em;max-width:240px}
.scover small{opacity:.9;font-size:12.5px}
.scover .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1;max-width:330px}
.scover .tags span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}

/* profil */
.phead{background:radial-gradient(130% 120% at 100% 0%,#3d7bff 0%,#2a5ccc 40%,#12306f 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 54px;border-radius:0 0 30px 30px;text-align:center}
.phead .aav{width:78px;height:78px;font-size:26px;margin:6px auto 10px}
.phead h2{margin:0;font-size:21px}
.phead small{opacity:.85}
.plist{background:#fff;border-radius:20px;margin:-34px 16px 14px;position:relative;box-shadow:0 12px 30px -18px rgba(10,22,51,.4);overflow:hidden}
.plist button,.plist a{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 16px;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none;text-align:left;border-bottom:1px solid #eef1f6}
.plist>*:last-child{border-bottom:0}
.plist .e3d{font-size:26px}
.plist .grow small{display:block;color:#7a869e;font-weight:500;font-size:12px}
.plist .chev{color:#b5bfd2}

/* login */
.login{min-height:100vh;background:#fff;display:flex;flex-direction:column}
.lhero{background:radial-gradient(130% 120% at 100% 0%,#3d7bff 0%,#2a5ccc 40%,#12306f 100%);border-radius:0 0 34px 34px;padding:calc(26px + env(safe-area-inset-top)) 22px 0;color:#fff;position:relative;overflow:hidden;min-height:250px}
.lhero .wmk{display:flex;align-items:center;gap:10px;color:#fff}
.lhero .wmk .jmark{height:34px;color:#fff}
.lhero .wmk b{font-family:Montserrat,'Plus Jakarta Sans',sans-serif;letter-spacing:.2em;font-size:17px}
.lhero .wmk b i{font-style:normal;font-weight:300;color:#e5c88f}
.lhero p{margin:12px 0 0;max-width:170px;font-size:15px;line-height:1.35;opacity:.92}
.lhero .courier{position:absolute;right:-18px;bottom:-6px;width:250px}
.lform{padding:24px 22px 30px;flex:1}
.lform h2{margin:0 0 4px;font-size:26px;letter-spacing:-.035em;display:flex;align-items:center;gap:8px}
.lform h2 .e3d{font-size:30px}
.lform>p{margin:0 0 18px;color:#7a869e;font-size:14px}
.lin{display:flex;align-items:center;gap:10px;background:#f3f6fb;border:1.5px solid transparent;border-radius:16px;padding:0 14px;height:54px;margin-bottom:12px;color:#8a96ad;transition:.2s}
.lin:focus-within{border-color:#3b74ff;background:#fff;box-shadow:0 0 0 4px rgba(59,116,255,.12);color:#3b74ff}
.lin input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;color:var(--ink)}
.lin .ic{font-size:19px}
.lbtn{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(120deg,#12306f 0%,#2a5ccc 50%,#4f90ff 100%);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 14px 30px -14px rgba(42,92,204,.9);margin-top:6px}
.lor{display:flex;align-items:center;gap:10px;color:#9aa6bd;font-size:12.5px;margin:18px 0}
.lor::before,.lor::after{content:"";flex:1;height:1px;background:#e6ebf3}
.lguest{width:100%;height:52px;border-radius:16px;border:1.5px solid #dfe6f2;background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.lfoot{text-align:center;color:#7a869e;font-size:13px;margin-top:18px}
.lfoot a{color:#2f6bff;font-weight:700;cursor:pointer}

/* splash */
#splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(120% 80% at 50% 40%,#ffffff 0%,#f1f6ff 60%,#e3edff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,transform .5s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .blob{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(124,194,255,.45),rgba(124,194,255,0) 70%);top:calc(50% - 230px)}
#splash .courier{width:min(300px,78vw);position:relative;animation:ridein 1.1s cubic-bezier(.2,.9,.25,1.05) both}
#splash .sbrand{display:flex;align-items:center;gap:12px;margin-top:22px;color:#0f1b2d;opacity:0;animation:rise .6s .9s cubic-bezier(.2,.8,.2,1) forwards}
#splash .sbrand .jmark{height:42px}
#splash .sbrand b{font-family:Montserrat,'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:24px;letter-spacing:.22em}
#splash .sbrand b i{font-style:normal;font-weight:300;color:#b08d4f}
#splash .stag{margin-top:8px;color:#5b6884;font-size:14px;opacity:0;animation:rise .6s 1.15s cubic-bezier(.2,.8,.2,1) forwards}
#splash .sload{margin-top:26px;width:120px;height:4px;border-radius:9px;background:#dbe6fb;overflow:hidden;opacity:0;animation:rise .4s 1.3s forwards}
#splash .sload i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#2f6bff,#7cc2ff);animation:loadbar 1.1s 1.3s ease-in-out infinite}
@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes ridein{0%{transform:translateX(-130%) rotate(-4deg)}70%{transform:translateX(6%) rotate(1deg)}100%{transform:translateX(0)}}
.courier .cr-wheel{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
.courier .cr-bob{animation:bob .45s ease-in-out infinite alternate}
.courier .cr-lines path{stroke-dasharray:40 60;animation:dash .7s linear infinite}
.courier .cr-lines path:nth-child(2){animation-delay:.2s}.courier .cr-lines path:nth-child(3){animation-delay:.4s}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes dash{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}

/* sukses pesanan + confetti */
.okhero{text-align:center;padding:10px 20px 16px}
.okhero .e3d{font-size:96px;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
.okhero h2{margin:8px 0 4px;font-size:22px;letter-spacing:-.03em}
.okhero p{margin:0;color:#7a869e}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:998;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* view lain di mode app */
body.app .v-wrap{padding:0 16px}
body.app .v-wrap .two{grid-template-columns:1fr}
body.app .v-wrap>.back,body.app .v-wrap>h2.sec{display:none}
body.app .v-wrap .card{border-radius:20px}

body.app .v-wrap .tab{flex:1}
body.app .modal{border-radius:26px}

@keyframes sheet{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

.ahero.flat{padding-bottom:22px}
.plist.p2{margin-top:0}
body.app .toast{top:auto;bottom:calc(150px + env(safe-area-inset-bottom))}
.scover .tags{max-width:290px}

button,a,label,select,[data-act]{touch-action:manipulation}

.fieldset{min-width:0}
.fieldset>*{max-width:100%}
input[type=file]{max-width:100%}

  .dash-hero{padding:16px;border-radius:22px;gap:12px}

  .dash-hero h2{font-size:21px}
  .dash-hero .actions{width:100%}
  .dash-hero .actions>*{flex:1;justify-content:center;text-align:center}
  .quick{grid-template-columns:1fr 1fr;gap:10px}
  .qa{padding:12px;gap:10px}

  .tabs{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}

  .modal-bg{align-items:flex-end;padding:0}

const sbStore = {
  listen(col, cb){
    let alive = true, t = null;
    if(col === "orders"){
      const load = async () => {
        const { data, error } = await SB.rpc("jt_orders", {p_key: KEY});
        if(!alive) return;
        if(error){ cb(null, false); return; }
        cb((data||[]).map(r => Object.assign({id: r.id.split("/").pop()}, r.data || {})), false);
      };
      ORD_REFRESH = load; load();
      const iv = setInterval(() => { if(!document.hidden) load(); }, 8000);
      const vis = () => { if(!document.hidden) load(); }; document.addEventListener("visibilitychange", vis);
      return () => { alive = false; clearInterval(iv); document.removeEventListener("visibilitychange", vis); };
    }
    const load = async () => {
      const { data, error } = await SB.from("docs").select("id,data").eq("col", col);
      if(!alive) return;
      if(error){ cb(null, false); return; }
      cb(data.map(r => Object.assign({id: r.id.split("/").pop()}, r.data || {})), false);
    };
    const soon = () => { clearTimeout(t); t = setTimeout(load, 150); };
    load();
    const ch = SB.channel("c:" + col + ":" + Math.random().toString(36).slice(2))
      .on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"col=eq." + col}, soon)
      .subscribe();
    const iv = setInterval(() => { if(!document.hidden) load(); }, 30000);
    return () => { alive = false; clearInterval(iv); clearTimeout(t); try{ SB.removeChannel(ch); }catch(e){} };
  },
  async rpc(fn, args){ const { data, error } = await SB.rpc(fn, Object.assign({p_key: KEY}, args)); if(error) throw sbErr(error); return data; },
  async set(path, data){
    if(path.startsWith("orders/")){ await this.rpc("jt_order_create", {p_id: path.slice(7), p_data: data}); if(ORD_REFRESH) await ORD_REFRESH(); return; }
    await this.rpc("jt_write", {p_op:"set", p_path:path, p_data:data});
    if(/^stores\/[^/]+$/.test(path)){ if(S.myStoreIds) S.myStoreIds.add(path.slice(7)); refreshMyStores(); }
  },
  async update(path, data){
    if(path.startsWith("orders/")){ await this.rpc("jt_order_update", {p_id: path.slice(7), p_data: data}); if(ORD_REFRESH) await ORD_REFRESH(); return; }
    await this.rpc("jt_write", {p_op:"update", p_path:path, p_data:data});
  },
  async del(path){ await this.rpc("jt_write", {p_op:"delete", p_path:path, p_data:null}); }
};
function localFire(){ local.subs.forEach(s=>s.fire()); }
const store = {
  listen(col, cb){
    if(SB) return sbStore.listen(col, cb);
    if(DB){
      return DB.collection(col).onSnapshot(
        s => cb(s.docs.map(d => Object.assign({id:d.id}, d.data())), s.metadata.fromCache),
        e => { toast("Data tidak dapat dimuat ("+e.code+")"); cb(null, false); }
      );
    }
    const pre = col + "/";
    const sub = { fire(){
      const rows = Object.entries(local.data)
        .filter(([p]) => p.startsWith(pre) && !p.slice(pre.length).includes("/"))
        .map(([p,v]) => Object.assign({id:p.slice(pre.length)}, v));
      cb(rows, false);
    }};
    local.subs.push(sub); setTimeout(()=>sub.fire(), 0);
    return () => { local.subs = local.subs.filter(x => x !== sub); };
  },
  async set(path, data){
    if(SB) return sbStore.set(path, data);
    if(DB) return DB.doc(path).set(data);
    local.data[path] = JSON.parse(JSON.stringify(data)); localSave(); localFire();
  },
  async update(path, data){
    if(SB) return sbStore.update(path, data);
    if(DB) return DB.doc(path).update(data);
    local.data[path] = deepMerge(local.data[path] || {}, JSON.parse(JSON.stringify(data))); localSave(); localFire();
  },
  async del(path){
    if(SB) return sbStore.del(path);
    if(DB) return DB.doc(path).delete();
    delete local.data[path]; localSave(); localFire();
  }
};
async function safe(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if(code === "server") toast(e.message.replace(/^.*?:\s*/, "").slice(0,140));
    else if(code === "invalid_argument") toast("Tidak bisa menyimpan: akun Anda tidak punya izin menulis, atau data terlalu besar.");
    else if(code === "quota_exceeded") toast("Kapasitas penyimpanan penuh. Hapus beberapa data lama.");
    else if(code === "resource_exhausted") toast("Terlalu banyak permintaan, coba lagi sebentar.");
    else toast("Gagal menyimpan, coba lagi.");
    return false;
  }
}

function compressImage(file, max){
  return new Promise((res, rej) => {
    if(!file || !file.type.startsWith("image/")) return rej(new Error("bukan gambar"));
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function viewSig(){ return [S.role, S.view, S.storeId, S.prodId, S.orderId, S.sellerTab, S.sellerStoreId, S.drv && S.drv.editing].join("|"); }
function snapForms(){
  const app = document.getElementById("app"); if(!app) return null;
  const forms = [...app.querySelectorAll("form[id]")]; if(!forms.length) return null;
  const ae = document.activeElement;
  const snap = {sig: app.dataset.sig, forms: {}, focus: null};
  forms.forEach(f => {
    const vals = {};
    [...f.elements].forEach((el, i) => {
      if(!el.name || el.type === "file" || el.type === "submit" || el.tagName === "BUTTON") return;
      const k = el.name + (el.type === "radio" ? "=" + el.value : "");
      vals[k] = (el.type === "checkbox" || el.type === "radio") ? el.checked : el.value;
      if(el === ae){ snap.focus = {form:f.id, name:k}; try{ snap.focus.s = el.selectionStart; snap.focus.e = el.selectionEnd; }catch(_){} }
    });
    snap.forms[f.id] = vals;
  });
  return snap;
}
function restoreForms(snap){
  const app = document.getElementById("app"); if(!app) return;
  const sig = viewSig();
  if(snap && snap.sig === sig){
    Object.entries(snap.forms).forEach(([id, vals]) => {
      const f = document.getElementById(id); if(!f || f.tagName !== "FORM") return;
      [...f.elements].forEach(el => {
        if(!el.name || el.type === "file" || el.tagName === "BUTTON") return;
        const k = el.name + (el.type === "radio" ? "=" + el.value : "");
        if(!(k in vals)) return;
        if(el.type === "checkbox" || el.type === "radio") el.checked = vals[k]; else if(el.value !== vals[k]) el.value = vals[k];
        if(snap.focus && snap.focus.form === id && snap.focus.name === k){ try{ el.focus({preventScroll:true}); if(snap.focus.s != null) el.setSelectionRange(snap.focus.s, snap.focus.e); }catch(_){} }
      });
    });
  }
  app.dataset.sig = sig;
}

function stepper(o){
  if(o.status === "dibatalkan") return "";
  let flow = o.pay && o.pay.k === "cod" ? FLOW_COD : FLOW;
  if(o.selfDelivery) flow = flow.filter(f => f !== "mencari_driver" && f !== "driver_ke_toko");
  const idx = flow.indexOf(o.status === "diproses" ? (o.selfDelivery ? "diantar" : "mencari_driver") : o.status);
  return '<div class="steps">'+flow.map((f,i)=>'<div class="step '+(i<=idx?"done":"")+'"><div class="bar"></div>'+esc(STEP_L[f]||STATUS[f].l)+'</div>').join("")+'</div>';
}

  let h = '<h2 class="sec">Pesanan Saya</h2><div class="tabs"><button class="tab '+(S.buyerTab==="aktif"?"on":"")+'" data-act="btab" data-v="aktif">Aktif ('+act.length+')</button><button class="tab '+(S.buyerTab==="riwayat"?"on":"")+'" data-act="btab" data-v="riwayat">Riwayat ('+done.length+')</button></div>';
  if(!S.ready.orders) return h + '<div class="empty">'+I("loader")+' Memuat…</div>';
  if(!list.length) return h + '<div class="empty card"><div class="big">'+I("package")+'</div>Belum ada pesanan di sini.</div>';
  return h + list.map(o => '<div class="card order" style="cursor:pointer" data-act="open-order" data-id="'+esc(o.id)+'"><div class="order-top"><div><b>'+esc(o.storeName)+'</b><div class="small muted">'+esc(o.code)+' · '+fmtDate(o.createdAt)+'</div></div>'+statusTag(o.status)+'</div>'+
    '<div class="small" style="margin-top:6px">'+o.items.map(i=>esc(i.name)+' ×'+i.qty).join(", ")+'</div><div style="margin-top:4px;font-weight:800">'+rp(o.total)+' <span class="small muted" style="font-weight:600">· '+esc(o.pay?o.pay.type:"")+'</span></div></div>').join("");
}

function payInstructions(o){
  const p = o.pay || {};
  if(p.k === "cod") return '<div class="paybox">'+I("cash")+' Siapkan uang tunai <b>'+rp(o.total)+'</b> saat pesanan tiba.</div>';
  let h = '<div class="paybox"><div class="small muted">Bayar ke akun '+esc(o.storeName)+' via <b>'+esc(p.type)+'</b></div>';
  if(p.qris) h += '<img class="qris" alt="QRIS toko" src="'+esc(p.qris)+'"><div class="small muted">Scan dengan aplikasi bank atau e-wallet apa pun.</div>';
  if(p.no) h += '<div class="acct" style="margin-top:6px">'+esc(p.no)+'</div><div class="small">a.n. <b>'+esc(p.holder||"-")+'</b></div><button class="btn ghost sm" style="margin-top:8px" data-act="copy" data-v="'+esc(p.no)+'">Salin nomor</button>';
  h += '<div style="margin-top:10px">Jumlah transfer: <b>'+rp(o.total)+'</b> <button class="btn ghost sm" data-act="copy" data-v="'+Math.round(o.total)+'">Salin</button></div></div>';
  return h;
}

    (["menunggu_pembayaran","menunggu_konfirmasi"].includes(o.status) || (o.status==="diproses" && o.pay && o.pay.k==="cod" && false) ?'<button class="btn danger sm" data-act="buyer-cancel" data-id="'+esc(o.id)+'">Batalkan pesanan</button>':'')+'</div>';

    '<div class="row"><span>Biaya admin</span><span class="free">Rp0</span></div><div class="row total"><span>Total belanja</span><span>'+rp(o.total)+'</span></div>'+
    (o.selfDelivery ? '' : '<div class="row"><span>Ongkir (ke driver)</span><span>'+(typeof o.ongkirFinal==="number" ? rp(o.ongkirFinal) : ongkirEstOf(o)==null ? ONGKIR_LBL : '±'+rp(ongkirEstOf(o))+' <small class="muted">nego</small>')+'</span></div>')+

    '<div class="actions" style="margin:0;align-items:center">'+(ms.length>1?'<select class="in" style="width:auto" data-act="pick-store">'+ms.map(m=>'<option value="'+esc(m.id)+'" '+(m.id===s.id?"selected":"")+'>'+esc(m.name)+'</option>').join("")+'</select>':'')+
    '<span class="switch '+(s.open===false?"":"on")+'" data-act="toggle-open"><i></i>'+(s.open===false?"Toko tutup":"Toko buka")+'</span>'+
    '<button class="btn ghost sm" data-act="preview-store" data-id="'+esc(s.id)+'">'+I("eye")+' Lihat toko</button>'+
    '<button class="btn ghost sm" data-act="go" data-v="register" data-new="1">+ Toko baru</button></div></div>';

  else if(S.sellerTab === "laporan") h += sellerReport(s, orders);
  else if(S.sellerTab === "saldo") h += sellerWallet(s);
  else h += storeForm(s) + storeLoginSettings(s) + (SB ? '<div class="card pad" style="margin-top:16px"><h3 class="sub">'+I("settings")+' Kode akses toko</h3><p class="small muted" style="margin:0 0 12px">Kode ini membuktikan bahwa Anda pemilik toko. Gunakan untuk membuka dashboard di HP/laptop lain. <b>Jangan bagikan ke siapa pun.</b></p><div class="actions"><button class="btn ghost sm" data-act="akses-copy">Salin kode akses</button><button class="btn ghost sm" data-act="akses">Masuk dengan kode lain</button></div></div>' : '');

function sellerDashboard(s, orders){
  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = t => t && new Date(t) >= today;
  const todayOrders = orders.filter(o => isToday(o.createdAt) && o.status !== "dibatalkan");
  const todayRev = orders.filter(o => o.status === "selesai" && isToday(o.doneAt||o.createdAt)).reduce((a,o)=>a+o.total,0);
  const need = orders.filter(o => ["menunggu_konfirmasi","diproses","mencari_driver","driver_ke_toko","diantar"].includes(o.status)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const prods = S.products[s.id] || [];
  const low = prods.filter(p => p.active !== false && typeof p.stock === "number" && p.stock <= 3);
  let h = walletChip(s) + '<div class="stats">'+
    '<div class="card stat"><div class="l">Omzet hari ini</div><div class="v">'+rp(todayRev)+'</div></div>'+
    '<div class="card stat"><div class="l">Pesanan hari ini</div><div class="v">'+todayOrders.length+'</div></div>'+
    '<div class="card stat"><div class="l">Perlu tindakan</div><div class="v" style="color:'+(need.length?"#3b74ff":"inherit")+'">'+need.length+'</div></div>'+
    '<div class="card stat" data-act="nav" data-v="seller" data-t="laporan" style="cursor:pointer"><div class="l">Bagi hasil 3% bulan ini</div><div class="v">'+rp(monthShare(orders, new Date()))+'</div><div class="small muted">'+prods.filter(p=>p.active!==false).length+' produk aktif'+(low.length?' · <span style="color:var(--warn);font-weight:700">'+low.length+' stok menipis</span>':'')+'</div></div></div>';
  const p = s.pay || {};
  const steps = [
    ["Lengkapi profil toko", !!(s.name && s.address && s.wa)],
    ["Atur akun pembayaran", payMethodsOf(s).length>0],
    ["Tambahkan logo toko", !!s.logo],
    ["Tambahkan produk pertama", prods.length>0],
    ["Pasang QRIS agar pembeli mudah bayar", !!p.qris],
    ["Atur titik lokasi toko agar driver terdekat ditemukan", typeof s.lat === "number"]
  ];
  if(steps.some(x=>!x[1])) h += '<div class="card checklist"><h3 class="sub">Siapkan toko Anda · '+steps.filter(x=>x[1]).length+'/'+steps.length+'</h3>'+steps.map(x=>'<div class="it '+(x[1]?"ok":"")+'"><span class="dot">'+(x[1]?"✓":"")+'</span><span>'+x[0]+'</span></div>').join("")+'</div>';
  h += '<div class="quick">'+
    '<div class="card qa" data-act="quick-add"><div class="ico">'+I("plus")+'</div><div><b>Tambah produk</b><span class="small muted">Foto, harga, stok</span></div></div>'+
    '<div class="card qa" data-act="nav" data-v="seller" data-t="pesanan"><div class="ico">'+I("receipt")+'</div><div><b>Kelola pesanan</b><span class="small muted">'+need.length+' menunggu</span></div></div>'+
    '<div class="card qa" data-act="share-store" data-id="'+esc(s.id)+'"><div class="ico">'+I("megaphone")+'</div><div><b>Promosikan toko</b><span class="small muted">Salin teks promosi</span></div></div>'+
    '<div class="card qa" data-act="nav" data-v="seller" data-t="laporan"><div class="ico">'+I("chart")+'</div><div><b>Laporan</b><span class="small muted">Omzet & terlaris</span></div></div></div>';
  h += '<div class="sec-head"><h2 style="font-size:20px">Perlu tindakan</h2>'+(need.length?'<button class="btn ghost sm" data-act="nav" data-v="seller" data-t="pesanan">Semua pesanan →</button>':'')+'</div>';
  h += need.length ? need.slice(0,5).map(o => orderCard(s,o)).join("") : '<div class="empty card"><div class="big">'+I("coffee")+'</div><b>Semua beres.</b><p>Pesanan baru akan muncul di sini.</p></div>';
  if(low.length) h += '<div class="card pad" style="margin-top:16px"><h3 class="sub">Stok menipis</h3>'+low.map(p=>'<div class="line-item"><div class="thumb">'+(p.img?'<img alt="" src="'+esc(p.img)+'">':I("package"))+'</div><div class="grow"><b>'+esc(p.name)+'</b><div class="small muted">Sisa '+p.stock+'</div></div><button class="btn ghost sm" data-act="edit-prod" data-id="'+esc(p.id)+'">Tambah stok</button></div>').join("")+'</div>';
  return h;
}
function sellerOrders(s, orders){
  const groups = {
    aktif: orders.filter(o => !["selesai","dibatalkan"].includes(o.status)),
    selesai: orders.filter(o => o.status === "selesai"),
    batal: orders.filter(o => o.status === "dibatalkan")
  };
  const list = (groups[S.orderFilter]||[]).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let h = (walletLow(s.id, 0) ? walletChip(s) : '') + '<div class="tabs">'+[["aktif","Aktif"],["selesai","Selesai"],["batal","Dibatalkan"]].map(t=>'<button class="chip '+(S.orderFilter===t[0]?"on":"")+'" data-act="ofilter" data-v="'+t[0]+'">'+t[1]+' ('+groups[t[0]].length+')</button>').join("")+'</div>';
  if(!list.length) return h + '<div class="empty card"><div class="big">'+I("inbox")+'</div>Belum ada pesanan di sini.</div>';
  return h + list.map(o => orderCard(s,o)).join("");
}
function orderCard(s, o){
  {
    let acts = "";
    if(o.status==="menunggu_pembayaran") acts = '<span class="small muted">Menunggu pembeli membayar.</span>';
    const cod = o.pay && o.pay.k === "cod";
    const selfBtn = '<button class="btn ghost sm" data-act="self-deliver" data-id="'+esc(o.id)+'">Antar sendiri</button>';
    let info = "";
    if(o.status==="menunggu_konfirmasi") acts = cod ? '<button class="btn sm" data-act="set-status" data-id="'+esc(o.id)+'" data-v="mencari_driver">✓ Terima pesanan & cari driver</button>'
      : '<button class="btn sm" data-act="set-status" data-id="'+esc(o.id)+'" data-v="mencari_driver">✓ Pembayaran diterima, cari driver</button><button class="btn danger sm" data-act="set-status" data-id="'+esc(o.id)+'" data-v="menunggu_pembayaran">Bukti tidak valid</button>';
    if(o.status==="diproses") acts = '<button class="btn sm" data-act="set-status" data-id="'+esc(o.id)+'" data-v="mencari_driver">'+I("truck")+' Cari driver</button>'+selfBtn;
    if(["menunggu_konfirmasi","menunggu_pembayaran"].includes(o.status) && walletLow(o.storeId, typeof o.share==="number"?o.share:shareOf(o))){
      info += '<div class="wlowbox">'+E("money")+'<div><b>Saldo toko kurang</b><small>Butuh minimal '+rp(walletNeed(o.storeId, o.share))+' untuk menerima pesanan ini. Saldo sekarang '+rp((S.wallet[o.storeId]||{}).balance||0)+'.</small></div><button class="btn sm" data-act="nav" data-v="seller" data-t="saldo">Isi saldo</button></div>';
      if(o.status==="menunggu_konfirmasi") acts = "";
    }
    if(o.status==="mencari_driver"){ info = searchBox(o, "Mencari driver terdekat dari toko Anda…", true); acts = (searchElapsed(o) >= 210 ? '<button class="btn sm" data-act="set-status" data-id="'+esc(o.id)+'" data-v="mencari_driver">Cari ulang</button>' : '')+selfBtn; }
    if(o.status==="driver_ke_toko"){ info = driverBox(o, "Driver menuju toko Anda. Siapkan pesanan."+(cod?" (COD — atur pembayaran barang dengan driver)":""), true) + liveMap(o, "toko"); }
    if(o.status==="diantar"){ if(o.driverId) info = driverBox(o, "Pesanan sedang diantar driver ke pembeli.", true); else acts = '<button class="btn sm" data-act="set-status" data-id="'+esc(o.id)+'" data-v="selesai">Tandai selesai</button>'; }
    if(!["selesai","dibatalkan","diantar"].includes(o.status)) acts += '<button class="btn danger sm" data-act="seller-cancel" data-id="'+esc(o.id)+'">Tolak / batalkan</button>';
    if(o.status==="menunggu_konfirmasi" && s && typeof s.lat !== "number") info += '<div class="small" style="margin-top:8px;color:var(--warn);font-weight:600">'+I("pin")+' Lokasi toko belum diatur — driver dicari dari semua yang online. Atur di Pengaturan agar dapat driver terdekat.</div>';
    return '<div class="card order"><div class="order-top"><div><b>'+esc(o.code)+'</b> <span class="small muted">· '+fmtDate(o.createdAt)+'</span><div class="small">'+esc(o.buyer.name)+' · <a target="_blank" rel="noopener" href="'+esc(waLink(o.buyer.wa,"Halo "+o.buyer.name+", ini dari "+s.name+" tentang pesanan "+o.code))+'">'+esc(o.buyer.wa)+'</a></div></div>'+statusTag(o.status)+'</div>'+
      '<div class="small" style="margin-top:8px">'+o.items.map(i=>'<b>'+i.qty+'×</b> '+esc(i.name)).join(" · ")+'</div>'+
      '<div class="small muted" style="margin-top:4px">'+I("pin")+' '+esc(o.buyer.address)+(o.buyer.maps?' · <a target="_blank" rel="noopener" href="'+esc(o.buyer.maps)+'">peta</a>':'')+'</div>'+
      (o.buyer.note?'<div class="small muted">'+I("note")+' '+esc(o.buyer.note)+'</div>':'')+
      '<div style="margin-top:6px"><b>'+rp(o.total)+'</b> <span class="small muted">· '+esc(o.pay?o.pay.type:"")+' · bagi hasil 3%: '+rp(typeof o.share==="number"?o.share:shareOf(o))+'</span></div>'+
      (o.proof?'<details style="margin-top:6px"><summary class="small" style="cursor:pointer;font-weight:700">Lihat bukti pembayaran</summary><img class="proof" alt="Bukti pembayaran" src="'+esc(o.proof)+'"></details>':'')+
      info+'<div class="actions">'+acts+chatBtn(o, "toko", "Chat", "ghost sm")+'</div></div>';
  }
}

    '<div class="line-item"><div class="thumb">'+(p.img?'<img alt="" src="'+esc(p.img)+'">':I("package"))+'</div><div class="grow"><div style="font-weight:700">'+esc(p.name)+' '+(p.active===false?'<span class="tag gray">Disembunyikan</span>':'')+'</div><div class="small muted">'+rp(p.price)+(typeof p.stock==="number"?' · stok '+p.stock:' · stok tidak dibatasi')+'</div></div>'+

function monthKey(t){ const d = new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthShare(orders, date){ const k = monthKey(date); return orders.filter(o => o.status==="selesai" && monthKey(o.doneAt||o.createdAt)===k).reduce((a,o)=>a+(typeof o.share==="number"?o.share:shareOf(o)),0); }
function shareTable(s, orders){
  const done = orders.filter(o => o.status === "selesai");
  const m = {};
  done.forEach(o => { const k = monthKey(o.doneAt||o.createdAt); m[k] = m[k] || {n:0, sales:0, share:0}; m[k].n++; m[k].sales += o.total; m[k].share += (typeof o.share==="number"?o.share:shareOf(o)); });
  const keys = Object.keys(m).sort().reverse();
  const nowK = monthKey(Date.now());
  const label = k => { const [y,mo] = k.split("-"); return new Date(+y, +mo-1, 1).toLocaleDateString("id-ID",{month:"long", year:"numeric"}); };
  const msg = k => "Halo Jaga Toko, saya dari "+s.name+". Konfirmasi pembayaran bagi hasil 3% bulan "+label(k)+": "+rp(m[k].share)+" ("+m[k].n+" pesanan, penjualan "+rp(m[k].sales)+").";
  let h = '<div class="card pad" style="margin-top:16px"><h3 class="sub" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>'+I("percent")+' Bagi hasil Jaga Toko (3%)</span><span class="small muted" style="font-weight:600">dihitung dari pesanan selesai</span></h3>';
  if(!keys.length) return h + '<div class="muted small">Belum ada penjualan selesai. Bagi hasil hanya dihitung dari pesanan yang selesai.</div></div>';
  h += '<table class="t"><tr><th>Bulan</th><th class="num">Pesanan</th><th class="num">Penjualan</th><th class="num">Bagi hasil 3%</th><th></th></tr>'+
    keys.map(k => '<tr><td>'+esc(label(k))+(k===nowK?' <span class="tag gray">berjalan</span>':'')+'</td><td class="num">'+m[k].n+'</td><td class="num">'+rp(m[k].sales)+'</td><td class="num"><b>'+rp(m[k].share)+'</b></td><td class="num">'+
      '<span class="small muted">dipotong dari saldo</span>'+'</td></tr>').join("")+'</table>';
  h += '<div class="hint" style="margin-top:10px">Bagi hasil dipotong otomatis dari saldo toko setiap pesanan selesai. Lihat rinciannya di <a style="cursor:pointer;font-weight:700" data-act="nav" data-v="seller" data-t="saldo">menu Saldo</a>.</div></div>';
  return h;
}
function sellerReport(s, orders){
  const done = orders.filter(o => o.status === "selesai");
  const omzet = done.reduce((a,o)=>a+o.total,0);
  const active = orders.filter(o => !["selesai","dibatalkan"].includes(o.status));
  const pending = active.reduce((a,o)=>a+o.total,0);
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push({d, v:0}); }
  done.forEach(o => { const t = new Date(o.doneAt||o.createdAt); t.setHours(0,0,0,0); const x = days.find(y=>y.d.getTime()===t.getTime()); if(x) x.v += o.total; });
  const max = Math.max(1, ...days.map(x=>x.v));
  const top = {};
  done.forEach(o => o.items.forEach(i => { top[i.name] = top[i.name] || {q:0,v:0}; top[i.name].q += i.qty; top[i.name].v += i.qty*i.price; }));
  const topList = Object.entries(top).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  const byPay = {};
  done.forEach(o => { const k = o.pay?o.pay.type:"-"; byPay[k] = (byPay[k]||0)+o.total; });
  let h = '<div class="stats">'+
    '<div class="card stat"><div class="l">Omzet (pesanan selesai)</div><div class="v">'+rp(omzet)+'</div></div>'+
    '<div class="card stat"><div class="l">Pesanan selesai</div><div class="v">'+done.length+'</div></div>'+
    '<div class="card stat"><div class="l">Rata-rata per pesanan</div><div class="v">'+rp(done.length?omzet/done.length:0)+'</div></div>'+
    '<div class="card stat"><div class="l">Pesanan aktif</div><div class="v">'+active.length+'</div><div class="small muted">'+rp(pending)+' belum selesai</div></div></div>';
  h += '<div class="two"><div class="card pad"><h3 class="sub">Omzet 7 hari terakhir</h3><div class="bars">'+days.map(x=>'<div class="b" title="'+rp(x.v)+'"><span>'+(x.v?(x.v>=1e6?(x.v/1e6).toFixed(1)+"jt":Math.round(x.v/1e3)+"rb"):"")+'</span><i style="height:'+(x.v/max*100)+'%"></i>'+x.d.toLocaleDateString("id-ID",{weekday:"short"})+'</div>').join("")+'</div></div>';
  h += '<div class="card pad"><h3 class="sub">Per metode pembayaran</h3>'+(Object.keys(byPay).length?'<table class="t">'+Object.entries(byPay).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="num">'+rp(v)+'</td></tr>').join("")+'</table>':'<div class="muted small">Belum ada data.</div>')+'</div></div>';
  h += shareTable(s, orders);
  h += '<div class="card pad" style="margin-top:16px"><h3 class="sub">Produk terlaris</h3>'+(topList.length?'<table class="t"><tr><th>Produk</th><th class="num">Terjual</th><th class="num">Pendapatan</th></tr>'+topList.map(([n,x])=>'<tr><td>'+esc(n)+'</td><td class="num">'+x.q+'</td><td class="num">'+rp(x.v)+'</td></tr>').join("")+'</table>':'<div class="muted small">Belum ada penjualan selesai.</div>')+'</div>';
  return h;
}

function changeQty(pid, d){
  const f = findProd(pid);
  const sid = f ? f.sid : S.cart.storeId;
  const p = f ? f.p : null;
  const cur = S.cart.storeId === sid ? S.cart.items[pid] : null;
  if(d > 0 && S.cart.storeId && S.cart.storeId !== sid && cartCount()){
    const other = storeById(S.cart.storeId);
    confirmModal("Keranjang Anda berisi barang dari "+(other?other.name:"toko lain")+". Setiap pesanan dibayar langsung ke satu toko. Kosongkan keranjang dan mulai dari toko ini?", "Ganti toko", async () => { S.cart = {storeId:null, items:{}}; changeQty(pid, d); });
    return;
  }
  if(!p && !cur) return;
  const qty = (cur ? cur.qty : 0) + d;
  if(p && typeof p.stock === "number" && qty > p.stock){ toast("Stok tersisa "+p.stock); return; }
  S.cart.storeId = sid;
  if(qty <= 0) delete S.cart.items[pid];
  else S.cart.items[pid] = {pid, name:(p||cur).name, price:(p||cur).price, img:(p||cur).img||"", qty};
  if(!Object.keys(S.cart.items).length) S.cart.storeId = null;
  saveCart(); render();
}

async function placeOrder(form){
  const s = storeById(S.cart.storeId); if(!s) return;
  const fd = new FormData(form);
  const buyer = {name:fd.get("name").trim(), wa:fd.get("wa").trim(), address:fd.get("address").trim(), maps:(fd.get("maps")||"").trim(), note:(fd.get("note")||"").trim()};
  const blat = parseFloat(fd.get("blat")), blng = parseFloat(fd.get("blng"));
  if(isFinite(blat) && isFinite(blng)){ buyer.lat = blat; buyer.lng = blng; }
  if(!buyer.name || !buyer.wa || !buyer.address) return toast("Lengkapi nama, WhatsApp, dan alamat.");
  if(buyer.maps && !/^https?:\/\//i.test(buyer.maps)) buyer.maps = "";
  const k = fd.get("pay") || S.payChoice; if(!k) return toast("Pilih metode pembayaran.");
  try{ localStorage.setItem("st_buyer", JSON.stringify(Object.assign(getProf(), {name:buyer.name, wa:buyer.wa, address:buyer.address, maps:buyer.maps}, isFinite(blat) ? {lat:blat, lng:blng} : {}))); }catch(e){}
  const prods = S.products[s.id] || [];
  const t = cartTotals();
  for(const i of t.items){
    const p = prods.find(x=>x.id===i.pid);
    if(!p || p.active===false) return toast(i.name+" sudah tidak tersedia.");
    if(typeof p.stock === "number" && p.stock < i.qty) return toast("Stok "+i.name+" tersisa "+p.stock+".");
    i.price = p.price;
  }
  const t2 = cartTotals();
  const pay = payDetail(s, k);
  const now = Date.now();
  const id = uid("o");
  const code = "JT-" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  const order = {code, storeId:s.id, storeName:s.name, buyerId:ME, buyer,
    items:t2.items.map(i=>({pid:i.pid, name:i.name, price:i.price, qty:i.qty})),
    subtotal:t2.subtotal, ongkir:0, ongkirPer500:ONGKIR_PER, admin:0, total:t2.total, shareRate:BAGI_HASIL, share:Math.round(t2.total*BAGI_HASIL), pay,
    storeAddress:s.address||"", storeWa:s.wa||"",
    status: k === "cod" ? "menunggu_konfirmasi" : "menunggu_pembayaran", createdAt:now, updatedAt:now};
  if(typeof s.lat === "number" && typeof s.lng === "number") order.storeLoc = {lat:s.lat, lng:s.lng};
  if(locOk(order.storeLoc) && locOk(buyer)){ order.ongkirDist = Math.round(distM(order.storeLoc, buyer)); order.ongkirEst = ongkirByDist(order.ongkirDist); }
  const btn = form.querySelector("button"); if(btn) btn.disabled = true;
  const ok = await safe(() => store.set("orders/"+id, order));
  if(btn) btn.disabled = false;
  if(!ok) return;
  for(const i of t2.items){
    const p = prods.find(x=>x.id===i.pid);
    if(!SB && p && typeof p.stock === "number") await safe(() => store.update("stores/"+s.id+"/products/"+p.id, {stock:Math.max(0,p.stock-i.qty)}));
  }
  S.cart = {storeId:null, items:{}}; saveCart();
  go("order", {orderId:id, justOrdered:true});
  S.hist = [{view:"orders"}];
  if(S.role !== "seller") celebrate(); else toast("Pesanan dibuat!");
}

async function saveStore(form){
  if(S.mode === "db" && !form.dataset.id){ toast("Pendaftaran toko hanya di jagapatner.my.id/toko/#mitra — ini halaman pratinjau."); return; }
  const fd = new FormData(form);
  const id = form.dataset.id;
  const old = id ? storeById(id) : null;
  const ewallet = [0,1].map(i => ({type:fd.get("ew"+i+"type"), no:(fd.get("ew"+i+"no")||"").trim(), holder:(fd.get("ew"+i+"holder")||"").trim()})).filter(w => w.type && w.no);
  let qris = old && old.pay ? old.pay.qris || "" : "";
  if(fd.get("qrisRemove")) qris = "";
  if(pending.qris) qris = pending.qris;
  const pay = {bank:{name:(fd.get("bankName")||"").trim(), no:(fd.get("bankNo")||"").trim(), holder:(fd.get("bankHolder")||"").trim()}, ewallet, qris, cod:!!fd.get("cod")};
  const data = {
    name:fd.get("name").trim(), category:fd.get("category"), area:fd.get("area").trim(), desc:(fd.get("desc")||"").trim(),
    address:fd.get("address").trim(), wa:fd.get("wa").trim(), hours:(fd.get("hours")||"").trim(),
    logo: pending.logo !== undefined ? pending.logo : (old ? old.logo || "" : ""), pay
  };
  const slat = parseFloat(fd.get("slat")), slng = parseFloat(fd.get("slng"));
  if(isFinite(slat) && isFinite(slng)){ data.lat = slat; data.lng = slng; }
  if(!payMethodsOf(data).length) return toast("Isi minimal satu metode pembayaran (rekening, e-wallet, QRIS, atau COD).");
  if(!old && !fd.get("agreeShare")) return toast("Centang persetujuan bagi hasil 3% untuk mendaftar.");
  if(old){
    const ok = await safe(() => store.update("stores/"+id, Object.assign(data, {updatedAt:Date.now()})), "Perubahan disimpan");
    if(ok){ pending.logo = pending.qris = undefined; }
  } else {
    const nid = uid("s");
    const ok = await safe(() => store.set("stores/"+nid, Object.assign(data, {ownerId:ME, open:true, active:true, shareRate:BAGI_HASIL, shareAgreedAt:Date.now(), color:COLORS[Math.floor(Math.random()*COLORS.length)], createdAt:Date.now()})), "Toko berhasil didaftarkan!");
    if(ok){ pending.logo = pending.qris = undefined; S.sellerStoreId = nid; await localBonus(nid); loadWallet(nid); go("seller", {sellerTab:"ringkasan"}); }
  }
}

async function setStatus(oid, status, extra){
  const o = S.orders.find(x=>x.id===oid); if(!o) return;
  if(!SB && S.role === "seller" && ["diproses","mencari_driver","diantar","selesai"].includes(status) && ["menunggu_pembayaran","menunggu_konfirmasi"].includes(o.status)){
    const need = Math.max(wCfgLocal().minBalance || 0, typeof o.share === "number" ? o.share : shareOf(o));
    if(balLocal(o.storeId) < need){ toast("Saldo toko kurang (minimal "+rp(need)+"). Isi saldo dulu di menu Saldo."); return false; }
  }
  const data = Object.assign({status, updatedAt:Date.now()}, extra||{});
  if(status === "selesai") data.doneAt = Date.now();
  if(status === "menunggu_pembayaran") data.proof = "";
  if(status === "mencari_driver"){ data.searchAt = Date.now(); data.declined = []; }
  const ok = await safe(() => store.update("orders/"+oid, data), "Status: "+STATUS[status].l);
  if(ok && status === "selesai") await localChargeFee(o);
  if(S.role === "seller") loadWallet(o.storeId);
  return ok;
}
async function restock(o){
  if(SB) return; // server mengembalikan stok otomatis
  const prods = S.products[o.storeId];
  if(!prods) return;
  for(const i of o.items){ const p = prods.find(x=>x.id===i.pid); if(p && typeof p.stock==="number") await safe(()=>store.update("stores/"+o.storeId+"/products/"+p.id,{stock:p.stock+i.qty})); }
}
