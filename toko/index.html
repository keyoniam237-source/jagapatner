<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Jaga Toko — belanja dari toko makanan, minuman, sembako, sayur & buah, rumah tangga, fashion, handphone, laptop dan game. Gratis ongkir, tanpa biaya admin.">
<link rel="icon" href="../jaga-logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1b2d">
<title>Jaga Toko — Semua Toko, Satu Aplikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#0a1633; --ink-2:#22304f; --muted:#66728a; --line:#e3e8f1;
  --brand:#0a1633; --brand-2:#050c1f; --lime:#2f6bff; --lime-2:#1f56e6; --sky:#7cc2ff; --brand-soft:#e6efff; --mint:#16a37a;
  --accent:#2f6bff; --accent-soft:#eef4ff;
  --danger:#e5484d; --danger-soft:#fdecec; --info:#3d63dd; --info-soft:#eaf0fe; --warn:#b26a00; --warn-soft:#fff3dc;
  --r:22px; --shadow:0 1px 0 rgba(0,0,0,.03),0 12px 32px -12px rgba(15,20,18,.14);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1400px 800px at 95% -25%,rgba(110,160,255,.26) 0%,rgba(110,160,255,.12) 35%,rgba(110,160,255,0) 70%),radial-gradient(1200px 800px at -15% -5%,rgba(130,205,255,.22) 0%,rgba(130,205,255,.08) 40%,rgba(130,205,255,0) 72%),linear-gradient(180deg,#f6f9fe 0%,#f2f5fb 100%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
::selection{background:#cfe0ff}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:12px;z-index:20;padding:0 12px}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px;background:rgba(255,255,255,.72);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 8px 30px -14px rgba(0,0,0,.18);padding:0 10px 0 14px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;white-space:nowrap;color:#0f1b2d}
.jmark{height:36px;width:auto;display:block}
.lsep{width:1px;height:30px;background:currentColor;opacity:.35}
.logo .wm{font-family:Montserrat,'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:19px;letter-spacing:.24em;line-height:1}
.logo .wm b{font-weight:300;color:#b08d4f}
body.is-seller .logo .wm b{color:#d9bb82}
.nav{display:flex;gap:2px;margin-left:auto;background:#edf1f8;padding:4px;border-radius:14px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);position:relative;transition:.15s}
.nav button:hover{color:var(--ink)}
.nav button.on{background:#fff;color:#1f4fd1;box-shadow:0 2px 8px -2px rgba(0,0,0,.12)}
.nav .badge{position:absolute;top:1px;right:1px;background:var(--lime);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px}
.bottomnav{display:none}
main{padding:26px 0 110px}
.notice{background:var(--warn-soft);border:1px solid #f5dfb3;color:#7a4c00;padding:11px 15px;border-radius:14px;font-size:13px;margin-bottom:16px;font-weight:500}
/* hero bento */
.bento{display:grid;grid-template-columns:1.7fr 1fr 1fr;grid-template-rows:auto auto;gap:14px;margin-bottom:22px}
.hero{grid-row:span 2;background:radial-gradient(130% 120% at 100% 0%,#2a5ccc 0%,#1d438f 28%,#142f68 55%,#0d1f48 80%,#0b1a3d 100%);color:#fff;border-radius:28px;padding:34px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:330px}
.hero::before{content:"";position:absolute;width:620px;height:620px;right:-220px;top:-280px;background:radial-gradient(circle,rgba(120,190,255,.38) 0%,rgba(120,190,255,.16) 35%,rgba(120,190,255,0) 70%);filter:blur(40px)}
.hero::after{content:"";position:absolute;width:520px;height:520px;left:-200px;bottom:-300px;background:radial-gradient(circle,rgba(99,102,241,.28) 0%,rgba(99,102,241,.1) 40%,rgba(99,102,241,0) 70%);filter:blur(40px)}
.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:6px 12px 6px 8px;border-radius:99px;width:max-content}
.eyebrow i{width:8px;height:8px;border-radius:99px;background:var(--sky);box-shadow:0 0 0 4px rgba(124,194,255,.25)}
.hero h1{margin:18px 0 10px;font-size:44px;letter-spacing:-.045em;line-height:1.02;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7cc2ff,#a8d8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#b4c3e0;max-width:440px}
.hero .search{margin:24px 0 0;background:#fff;border-radius:16px;padding:6px;display:flex;gap:6px}
.hero .search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 12px;outline:none;color:var(--ink)}
.hero .search .btn{border-radius:12px}
.tile{border-radius:24px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:158px;position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.tile .k{font-size:38px;font-weight:800;letter-spacing:-.05em;line-height:1}
.tile .d{font-size:13px;color:var(--muted);font-weight:600}
.tile .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#eef3fb}
.tile.lime{background:linear-gradient(150deg,#3a72ff 0%,#4a8aff 40%,#5ea5ff 75%,#74baff 100%);border-color:transparent;color:#fff}
.tile.lime .d{color:#dce9ff}
.tile.lime .ico{background:rgba(255,255,255,.2)}
.tile.cta{cursor:pointer;background:radial-gradient(120% 120% at 100% 0%,#24489a 0%,#183573 40%,#10244f 75%,#0b1a3d 100%);color:#fff;border:0}
.tile.cta .d{color:#a9b8d8}
.tile.cta .ico{background:var(--lime);color:#fff}
.tile.cta:hover .arrow{transform:translate(3px,-3px)}
.arrow{transition:transform .2s;font-size:22px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.sec-head{display:flex;align-items:end;justify-content:space-between;margin:6px 0 14px}
.sec-head h2{margin:0;font-size:24px;letter-spacing:-.035em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.8);padding:9px 15px;border-radius:99px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:13.5px;transition:.15s}
.chip:hover{border-color:#c4cfe2;background:#fff}
.chip.on{background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%);color:#fff;border-color:var(--lime);box-shadow:0 6px 16px -6px rgba(47,107,255,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.store-card{cursor:pointer;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;padding:8px}
.store-card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -18px rgba(15,20,18,.3)}
.store-card .cover{height:120px;border-radius:16px;display:flex;align-items:flex-end;padding:12px;position:relative;overflow:hidden}
.store-card .cover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1px);background-size:14px 14px;opacity:.5}
.store-card .cover>*{position:relative;z-index:1}
.store-card .cover>.live,.store-card .cover>.closed{position:absolute}
.avatar{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.3);flex-shrink:0;letter-spacing:-.03em}
.avatar img{width:100%;height:100%;object-fit:cover}
.store-card .body{padding:12px 8px 8px}
.store-card h3{margin:0 0 3px;font-size:17px;letter-spacing:-.025em}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--brand-soft);color:#1f4fd1}
.tag.gray{background:#eef1f6;color:#4a5670}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.blue{background:var(--info-soft);color:var(--info)}
.closed{position:absolute;top:10px;right:10px}
.live{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;display:flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:9px;background:#22c55e}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:10px}
.empty b{color:var(--ink);font-size:17px}
.btn{border:0;background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4f7fc}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.accent,.btn.lime{background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%);color:#fff;box-shadow:0 10px 24px -10px rgba(59,116,255,.65)}
.btn.accent:hover,.btn.lime:hover{filter:brightness(1.06)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.back{border:0;background:#fff;border:1px solid var(--line);cursor:pointer;color:var(--ink);font-weight:700;padding:7px 13px;border-radius:99px;margin-bottom:14px;font-size:13px}
.store-head{padding:22px;display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.store-head .avatar{width:78px;height:78px;font-size:28px;border-radius:22px}
.store-head h2{margin:0 0 4px;font-size:26px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paylist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.prod{overflow:hidden;display:flex;flex-direction:column;padding:8px;transition:box-shadow .2s}
.prod:hover{box-shadow:0 18px 36px -18px rgba(15,20,18,.3)}
.prod .img{aspect-ratio:1/1;background:linear-gradient(140deg,#f1f5fc,#e4ebf7);border-radius:16px;display:grid;place-items:center;font-size:40px;overflow:hidden}
.prod .img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.prod:hover .img img{transform:scale(1.05)}
.prod .body{padding:10px 6px 4px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod h4{margin:0;font-size:15px;letter-spacing:-.02em}
.price{font-weight:800;font-size:16px;letter-spacing:-.02em}
.qty{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.qty button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:800;font-size:16px}
.qty button:hover{background:#eaf1ff;border-color:#bcd0ff;color:#1f4fd1}
.qty b{min-width:20px;text-align:center}
.cartbar{position:fixed;left:0;right:0;bottom:20px;z-index:15;display:flex;justify-content:center;pointer-events:none;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.cartbar .inner{pointer-events:auto;background:rgba(10,22,51,.94);backdrop-filter:blur(12px);color:#fff;border-radius:20px;padding:10px 10px 10px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 20px 50px -10px rgba(0,0,0,.45);min-width:min(540px,92vw);justify-content:space-between}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.pad{padding:22px}
h2.sec{font-size:26px;margin:0 0 16px;letter-spacing:-.04em}
h3.sub{font-size:16px;margin:0 0 12px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.row.total{border-top:1px dashed #d3dbe8;margin-top:8px;padding-top:14px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.free{color:#1f4fd1;font-weight:800;background:var(--brand-soft);padding:1px 8px;border-radius:7px;font-size:13px}
label.f{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;color:var(--ink-2)}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#f8faff;transition:.15s;outline:none}
.in:focus{border-color:var(--lime);background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.18)}
textarea.in{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;margin-bottom:8px;background:#fff;transition:.15s}
.opt.on{border-color:var(--lime);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.opt input{margin-top:3px;accent-color:var(--lime)}
.line-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.line-item:last-child{border-bottom:0}
.thumb{width:52px;height:52px;border-radius:14px;background:#eef2f9;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.steps{display:flex;gap:5px;margin:18px 0 6px}
.step{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.step .bar{height:6px;border-radius:9px;background:#e4e9f2;margin-bottom:7px}
.step.done .bar{background:linear-gradient(90deg,#3b74ff 0%,#5a9dff 100%)}
.step.done{color:#1f4fd1}
.paybox{background:linear-gradient(160deg,#f8fbff,#edf3fd);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.acct{font-size:26px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.qris{max-width:240px;width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin:10px 0;background:#fff;padding:8px}
.proof{max-width:220px;border-radius:14px;border:1px solid var(--line);display:block;margin-top:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;background:#e6ebf4;padding:4px;border-radius:16px;width:max-content;max-width:100%}
.tab{border:0;background:none;padding:9px 15px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted)}
.tab.on{background:#fff;color:#1f4fd1;box-shadow:0 2px 8px -2px rgba(0,0,0,.14)}
.order{padding:16px 18px;margin-bottom:12px;transition:box-shadow .2s}
.order[data-act]:hover{box-shadow:0 18px 36px -18px rgba(15,20,18,.3)}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px 20px}
.stat:first-child{background:linear-gradient(150deg,#3a72ff 0%,#4a8aff 45%,#6aafff 100%);color:#fff;border-color:transparent}
.stat:first-child .l{color:#dce9ff}
.stat:first-child .v{color:#fff}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.045em;margin-top:6px}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);font-weight:700}
.bars .b i{display:block;width:100%;max-width:38px;background:#c9d8f5;border-radius:10px;min-height:4px}
.bars .b:last-child i{background:var(--lime)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(10,22,51,.45);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:26px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:24px;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.96) translateY(10px);opacity:0}}
.toast{position:fixed;left:50%;top:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px 11px 14px;border-radius:14px;z-index:60;font-weight:700;font-size:14px;box-shadow:0 14px 34px -8px rgba(0,0,0,.4);max-width:90vw;display:flex;gap:9px;align-items:center;animation:pop .25s}
.toast::before{content:"";width:8px;height:8px;border-radius:9px;background:var(--sky);flex-shrink:0}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .prev{width:68px;height:68px;border-radius:16px;background:#eef2f9;overflow:hidden;display:grid;place-items:center;color:#9aa6bd;flex-shrink:0;border:1px dashed #c4cfe2}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
input[type=file]{font-size:13px}
input[type=file]::file-selector-button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:700;margin-right:10px;cursor:pointer}
.fieldset{border:1px solid var(--line);border-radius:18px;padding:6px 16px 16px;margin-top:16px}
.fieldset legend{font-weight:800;font-size:13px;padding:4px 10px;background:var(--lime);color:#fff;border-radius:99px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600;font-size:14px}
.check input{accent-color:var(--lime);width:17px;height:17px}
details summary{list-style:none}
@media (max-width:900px){
  .bento{grid-template-columns:1fr 1fr}
  .hero{grid-column:span 2;grid-row:auto;min-height:0}
}
@media (max-width:760px){
  header.top{top:8px;padding:0 8px}
  .nav{display:none}
  .bottomnav{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:rgba(10,22,51,.94);backdrop-filter:blur(14px);border-radius:22px;z-index:30;padding:7px;box-shadow:0 16px 40px -10px rgba(0,0,0,.45);margin-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#8e9cbb;padding:7px 2px;cursor:pointer;position:relative;border-radius:15px}
  .bottomnav button .ic{font-size:21px;display:grid;place-items:center}
  .bottomnav button.on{color:#fff;background:linear-gradient(135deg,#3b74ff 0%,#4685ff 45%,#5a9dff 100%)}
  .bottomnav .badge{position:absolute;top:2px;left:56%;background:var(--sky);color:var(--ink);font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px}
  .bottomnav button.on .badge{background:#fff;color:#1f4fd1}
  .cartbar{bottom:92px}
  .two{grid-template-columns:1fr}
  .hero{padding:26px 22px}
  .hero h1{font-size:32px}
  .tile{min-height:130px;padding:16px}
  .tile .k{font-size:30px}
  .cols2{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:10px}

const parentOf = p => p.split("/").slice(0,-1).join("/");
function deepMerge(a, b){
  const out = Object.assign({}, a);
  for(const k in b){ const v = b[k]; out[k] = (v && typeof v === "object" && !Array.isArray(v) && a && typeof a[k] === "object" && a[k] && !Array.isArray(a[k])) ? deepMerge(a[k], v) : v; }
  return out;
}
function sbErr(error){ const e = new Error(error && error.message || "gagal"); e.code = (error && /size|too large|payload/i.test(error.message||"")) ? "invalid_argument" : "unavailable"; return e; }
const sbStore = {
  listen(col, cb){
    let alive = true, t = null;
    const load = async () => {
      const { data, error } = await SB.from("docs").select("id,data").eq("col", col);
      if(!alive) return;
      if(error){ cb(null, false); return; }
      cb(data.map(r => Object.assign({id: r.id.split("/").pop()}, r.data || {})), false);
    };
    const soon = () => { clearTimeout(t); t = setTimeout(load, 150); };
    load();
    const ch = SB.channel("c:" + col + ":" + Math.random().toString(36).slice(2))
      .on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"col=eq." + col}, soon)
      .subscribe();
    const iv = setInterval(() => { if(!document.hidden) load(); }, 30000);
    return () => { alive = false; clearInterval(iv); clearTimeout(t); try{ SB.removeChannel(ch); }catch(e){} };
  },
  async set(path, data){
    const { error } = await SB.from("docs").upsert({id:path, col:parentOf(path), data, updated_at:new Date().toISOString()});
    if(error) throw sbErr(error);
  },
  async update(path, data){
    const { data: cur, error: e1 } = await SB.from("docs").select("data").eq("id", path).maybeSingle();
    if(e1) throw sbErr(e1);
    if(!cur){ const e = new Error("tidak ada"); e.code = "invalid_argument"; throw e; }
    const { error } = await SB.from("docs").update({data: deepMerge(cur.data || {}, data), updated_at:new Date().toISOString()}).eq("id", path);
    if(error) throw sbErr(error);
  },
  async del(path){
    const { error } = await SB.from("docs").delete().eq("id", path);
    if(error) throw sbErr(error);
  }
};
function localFire(){ local.subs.forEach(s=>s.fire()); }
const store = {
  listen(col, cb){
    if(SB) return sbStore.listen(col, cb);
    if(DB){
      return DB.collection(col).onSnapshot(
        s => cb(s.docs.map(d => Object.assign({id:d.id}, d.data())), s.metadata.fromCache),
        e => { toast("Data tidak dapat dimuat ("+e.code+")"); cb(null, false); }
      );
    }
    const pre = col + "/";
    const sub = { fire(){
      const rows = Object.entries(local.data)
        .filter(([p]) => p.startsWith(pre) && !p.slice(pre.length).includes("/"))
        .map(([p,v]) => Object.assign({id:p.slice(pre.length)}, v));
      cb(rows, false);
    }};
    local.subs.push(sub); setTimeout(()=>sub.fire(), 0);
    return () => { local.subs = local.subs.filter(x => x !== sub); };
  },
  async set(path, data){
    if(SB) return sbStore.set(path, data);
    if(DB) return DB.doc(path).set(data);
    local.data[path] = JSON.parse(JSON.stringify(data)); localSave(); localFire();
  },
  async update(path, data){
    if(SB) return sbStore.update(path, data);
    if(DB) return DB.doc(path).update(data);
    local.data[path] = deepMerge(local.data[path] || {}, JSON.parse(JSON.stringify(data))); localSave(); localFire();
  },
  async del(path){
    if(SB) return sbStore.del(path);
    if(DB) return DB.doc(path).delete();
    delete local.data[path]; localSave(); localFire();
  }
};
async function safe(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if(code === "invalid_argument") toast("Tidak bisa menyimpan: akun Anda tidak punya izin menulis, atau data terlalu besar.");
    else if(code === "quota_exceeded") toast("Kapasitas penyimpanan penuh. Hapus beberapa data lama.");
    else if(code === "resource_exhausted") toast("Terlalu banyak permintaan, coba lagi sebentar.");
    else toast("Gagal menyimpan, coba lagi.");
    return false;
  }
}

function payMethodsOf(s){
  const p = s.pay || {}; const out = [];
  if(p.bank && p.bank.no) out.push({k:"bank", l:"Transfer "+(p.bank.name||"Bank")});
  (p.ewallet||[]).forEach((w,i) => { if(w.no) out.push({k:"ew"+i, l:w.type}); });
  if(p.qris) out.push({k:"qris", l:"QRIS"});
  if(p.cod) out.push({k:"cod", l:"Bayar di tempat (COD)"});
  return out;
}
function payDetail(s, k){
  const p = s.pay || {};
  if(k === "bank") return {k, type:"Transfer "+(p.bank.name||"Bank"), no:p.bank.no, holder:p.bank.holder};
  if(k === "qris") return {k, type:"QRIS", qris:p.qris};
  if(k === "cod") return {k, type:"Bayar di tempat (COD)"};
  if(k.startsWith("ew")){ const w = (p.ewallet||[])[+k.slice(2)] || {}; return {k, type:w.type, no:w.no, holder:w.holder}; }
  return {k, type:k};
}
function compressImage(file, max){
  return new Promise((res, rej) => {
    if(!file || !file.type.startsWith("image/")) return rej(new Error("bukan gambar"));
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const allSubs = {};
function syncProductSubs(){
  const ids = S.stores.filter(visibleStore).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,50).map(s => s.id);
  Object.keys(allSubs).forEach(id => { if(!ids.includes(id)){ allSubs[id](); delete allSubs[id]; } });
  ids.forEach(id => {
    if(allSubs[id]) return;
    if(prodUnsubFor === id && prodUnsub){ prodUnsub(); prodUnsub = null; prodUnsubFor = null; }
    allSubs[id] = store.listen("stores/"+id+"/products", rows => {
      if(rows) S.products[id] = rows.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      else S.products[id] = S.products[id] || [];
      scheduleRender();
    });
  });
}
let _rT = null;
function scheduleRender(){ if(_rT) return; _rT = setTimeout(() => { _rT = null; render(); }, 30); }
function watchProducts(storeId){
  if(!storeId || prodUnsubFor === storeId || allSubs[storeId]) return;
  if(prodUnsub) prodUnsub();
  prodUnsubFor = storeId;
  prodUnsub = store.listen("stores/"+storeId+"/products", rows => {
    if(rows) S.products[storeId] = rows.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    else S.products[storeId] = S.products[storeId] || [];
    render();
  });
}

function stepper(o){
  if(o.status === "dibatalkan") return "";
  const flow = o.pay && o.pay.k === "cod" ? FLOW_COD : FLOW;
  const idx = flow.indexOf(o.status);
  return '<div class="steps">'+flow.map((f,i)=>'<div class="step '+(i<=idx?"done":"")+'"><div class="bar"></div>'+esc(STATUS[f].l.replace("Menunggu ","").replace("Sedang ",""))+'</div>').join("")+'</div>';
}

function sellerDashboard(s, orders){
  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = t => t && new Date(t) >= today;
  const todayOrders = orders.filter(o => isToday(o.createdAt) && o.status !== "dibatalkan");
  const todayRev = orders.filter(o => o.status === "selesai" && isToday(o.doneAt||o.createdAt)).reduce((a,o)=>a+o.total,0);
  const need = orders.filter(o => ["menunggu_konfirmasi","diproses","diantar"].includes(o.status)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const prods = S.products[s.id] || [];
  const low = prods.filter(p => p.active !== false && typeof p.stock === "number" && p.stock <= 3);
  let h = '<div class="stats">'+
    '<div class="card stat"><div class="l">Omzet hari ini</div><div class="v">'+rp(todayRev)+'</div></div>'+
    '<div class="card stat"><div class="l">Pesanan hari ini</div><div class="v">'+todayOrders.length+'</div></div>'+
    '<div class="card stat"><div class="l">Perlu tindakan</div><div class="v" style="color:'+(need.length?"#3b74ff":"inherit")+'">'+need.length+'</div></div>'+
    '<div class="card stat"><div class="l">Produk aktif</div><div class="v">'+prods.filter(p=>p.active!==false).length+'</div>'+(low.length?'<div class="small" style="color:var(--warn);font-weight:700">'+low.length+' stok menipis</div>':'')+'</div></div>';
  const p = s.pay || {};
  const steps = [
    ["Lengkapi profil toko", !!(s.name && s.address && s.wa)],
    ["Atur akun pembayaran", payMethodsOf(s).length>0],
    ["Tambahkan logo toko", !!s.logo],
    ["Tambahkan produk pertama", prods.length>0],
    ["Pasang QRIS agar pembeli mudah bayar", !!p.qris]
  ];
  if(steps.some(x=>!x[1])) h += '<div class="card checklist"><h3 class="sub">Siapkan toko Anda · '+steps.filter(x=>x[1]).length+'/'+steps.length+'</h3>'+steps.map(x=>'<div class="it '+(x[1]?"ok":"")+'"><span class="dot">'+(x[1]?"✓":"")+'</span><span>'+x[0]+'</span></div>').join("")+'</div>';
  h += '<div class="quick">'+
    '<div class="card qa" data-act="quick-add"><div class="ico">'+I("plus")+'</div><div><b>Tambah produk</b><span class="small muted">Foto, harga, stok</span></div></div>'+
    '<div class="card qa" data-act="nav" data-v="seller" data-t="pesanan"><div class="ico">'+I("receipt")+'</div><div><b>Kelola pesanan</b><span class="small muted">'+need.length+' menunggu</span></div></div>'+

function sellerReport(s, orders){
  const done = orders.filter(o => o.status === "selesai");
  const omzet = done.reduce((a,o)=>a+o.total,0);
  const active = orders.filter(o => !["selesai","dibatalkan"].includes(o.status));
  const pending = active.reduce((a,o)=>a+o.total,0);
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push({d, v:0}); }
  done.forEach(o => { const t = new Date(o.doneAt||o.createdAt); t.setHours(0,0,0,0); const x = days.find(y=>y.d.getTime()===t.getTime()); if(x) x.v += o.total; });
  const max = Math.max(1, ...days.map(x=>x.v));
  const top = {};
  done.forEach(o => o.items.forEach(i => { top[i.name] = top[i.name] || {q:0,v:0}; top[i.name].q += i.qty; top[i.name].v += i.qty*i.price; }));
  const topList = Object.entries(top).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  const byPay = {};
  done.forEach(o => { const k = o.pay?o.pay.type:"-"; byPay[k] = (byPay[k]||0)+o.total; });
  let h = '<div class="stats">'+
    '<div class="card stat"><div class="l">Omzet (pesanan selesai)</div><div class="v">'+rp(omzet)+'</div></div>'+
    '<div class="card stat"><div class="l">Pesanan selesai</div><div class="v">'+done.length+'</div></div>'+
    '<div class="card stat"><div class="l">Rata-rata per pesanan</div><div class="v">'+rp(done.length?omzet/done.length:0)+'</div></div>'+
    '<div class="card stat"><div class="l">Pesanan aktif</div><div class="v">'+active.length+'</div><div class="small muted">'+rp(pending)+' belum selesai</div></div></div>';
  h += '<div class="two"><div class="card pad"><h3 class="sub">Omzet 7 hari terakhir</h3><div class="bars">'+days.map(x=>'<div class="b" title="'+rp(x.v)+'"><span>'+(x.v?(x.v>=1e6?(x.v/1e6).toFixed(1)+"jt":Math.round(x.v/1e3)+"rb"):"")+'</span><i style="height:'+(x.v/max*100)+'%"></i>'+x.d.toLocaleDateString("id-ID",{weekday:"short"})+'</div>').join("")+'</div></div>';
  h += '<div class="card pad"><h3 class="sub">Per metode pembayaran</h3>'+(Object.keys(byPay).length?'<table class="t">'+Object.entries(byPay).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td class="num">'+rp(v)+'</td></tr>').join("")+'</table>':'<div class="muted small">Belum ada data.</div>')+'</div></div>';
  h += '<div class="card pad" style="margin-top:16px"><h3 class="sub">Produk terlaris</h3>'+(topList.length?'<table class="t"><tr><th>Produk</th><th class="num">Terjual</th><th class="num">Pendapatan</th></tr>'+topList.map(([n,x])=>'<tr><td>'+esc(n)+'</td><td class="num">'+x.q+'</td><td class="num">'+rp(x.v)+'</td></tr>').join("")+'</table>':'<div class="muted small">Belum ada penjualan selesai.</div>')+'</div>';
  return h;
}

const pending = {logo:undefined, qris:undefined, pimg:undefined};

function changeQty(pid, d){
  const f = findProd(pid);
  const sid = f ? f.sid : S.cart.storeId;
  const p = f ? f.p : null;
  const cur = S.cart.storeId === sid ? S.cart.items[pid] : null;
  if(d > 0 && S.cart.storeId && S.cart.storeId !== sid && cartCount()){
    const other = storeById(S.cart.storeId);
    confirmModal("Keranjang Anda berisi barang dari "+(other?other.name:"toko lain")+". Setiap pesanan dibayar langsung ke satu toko. Kosongkan keranjang dan mulai dari toko ini?", "Ganti toko", async () => { S.cart = {storeId:null, items:{}}; changeQty(pid, d); });
    return;
  }
  if(!p && !cur) return;
  const qty = (cur ? cur.qty : 0) + d;
  if(p && typeof p.stock === "number" && qty > p.stock){ toast("Stok tersisa "+p.stock); return; }
  S.cart.storeId = sid;
  if(qty <= 0) delete S.cart.items[pid];
  else S.cart.items[pid] = {pid, name:(p||cur).name, price:(p||cur).price, img:(p||cur).img||"", qty};
  if(!Object.keys(S.cart.items).length) S.cart.storeId = null;
  saveCart(); render();
}

async function placeOrder(form){
  const s = storeById(S.cart.storeId); if(!s) return;
  const fd = new FormData(form);
  const buyer = {name:fd.get("name").trim(), wa:fd.get("wa").trim(), address:fd.get("address").trim(), maps:(fd.get("maps")||"").trim(), note:(fd.get("note")||"").trim()};
  if(!buyer.name || !buyer.wa || !buyer.address) return toast("Lengkapi nama, WhatsApp, dan alamat.");
  if(buyer.maps && !/^https?:\/\//i.test(buyer.maps)) buyer.maps = "";
  const k = fd.get("pay") || S.payChoice; if(!k) return toast("Pilih metode pembayaran.");
  try{ localStorage.setItem("st_buyer", JSON.stringify({name:buyer.name, wa:buyer.wa, address:buyer.address, maps:buyer.maps})); }catch(e){}
  const prods = S.products[s.id] || [];
  const t = cartTotals();
  for(const i of t.items){
    const p = prods.find(x=>x.id===i.pid);
    if(!p || p.active===false) return toast(i.name+" sudah tidak tersedia.");
    if(typeof p.stock === "number" && p.stock < i.qty) return toast("Stok "+i.name+" tersisa "+p.stock+".");
    i.price = p.price;
  }
  const t2 = cartTotals();
  const pay = payDetail(s, k);
  const now = Date.now();
  const id = uid("o");
  const code = "JT-" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  const order = {code, storeId:s.id, storeName:s.name, buyerId:ME, buyer,
    items:t2.items.map(i=>({pid:i.pid, name:i.name, price:i.price, qty:i.qty})),
    subtotal:t2.subtotal, ongkir:0, admin:0, total:t2.total, pay,
    status: k === "cod" ? "diproses" : "menunggu_pembayaran", createdAt:now, updatedAt:now};
  const btn = form.querySelector("button"); if(btn) btn.disabled = true;
  const ok = await safe(() => store.set("orders/"+id, order));
  if(btn) btn.disabled = false;
  if(!ok) return;
  for(const i of t2.items){
    const p = prods.find(x=>x.id===i.pid);
    if(p && typeof p.stock === "number") await safe(() => store.update("stores/"+s.id+"/products/"+p.id, {stock:Math.max(0,p.stock-i.qty)}));
  }
  S.cart = {storeId:null, items:{}}; saveCart();
  toast("Pesanan dibuat!");
  go("order", {orderId:id});
}

async function saveStore(form){
  const fd = new FormData(form);
  const id = form.dataset.id;
  const old = id ? storeById(id) : null;
  const ewallet = [0,1].map(i => ({type:fd.get("ew"+i+"type"), no:(fd.get("ew"+i+"no")||"").trim(), holder:(fd.get("ew"+i+"holder")||"").trim()})).filter(w => w.type && w.no);
  let qris = old && old.pay ? old.pay.qris || "" : "";
  if(fd.get("qrisRemove")) qris = "";
  if(pending.qris) qris = pending.qris;
  const pay = {bank:{name:(fd.get("bankName")||"").trim(), no:(fd.get("bankNo")||"").trim(), holder:(fd.get("bankHolder")||"").trim()}, ewallet, qris, cod:!!fd.get("cod")};
  const data = {
    name:fd.get("name").trim(), category:fd.get("category"), area:fd.get("area").trim(), desc:(fd.get("desc")||"").trim(),
    address:fd.get("address").trim(), wa:fd.get("wa").trim(), hours:(fd.get("hours")||"").trim(),
    logo: pending.logo !== undefined ? pending.logo : (old ? old.logo || "" : ""), pay
  };
  if(!payMethodsOf(data).length) return toast("Isi minimal satu metode pembayaran (rekening, e-wallet, QRIS, atau COD).");
  if(old){
    const ok = await safe(() => store.update("stores/"+id, Object.assign(data, {updatedAt:Date.now()})), "Perubahan disimpan");
    if(ok){ pending.logo = pending.qris = undefined; }
  } else {
    const nid = uid("s");
    const ok = await safe(() => store.set("stores/"+nid, Object.assign(data, {ownerId:ME, open:true, active:true, color:COLORS[Math.floor(Math.random()*COLORS.length)], createdAt:Date.now()})), "Toko berhasil didaftarkan!");
    if(ok){ pending.logo = pending.qris = undefined; S.sellerStoreId = nid; go("seller", {sellerTab:"ringkasan"}); }
  }
}

async function saveProduct(form){
  const s = storeById(S.sellerStoreId); if(!s) return;
  const fd = new FormData(form);
  const id = form.dataset.id;
  const old = id ? (S.products[s.id]||[]).find(x=>x.id===id) : null;
  const stockRaw = (fd.get("stock")||"").trim();
  const data = {name:fd.get("name").trim(), price:Math.max(0, Number(fd.get("price"))||0), desc:(fd.get("desc")||"").trim(),
    stock: stockRaw === "" ? null : Math.max(0, parseInt(stockRaw,10)||0), active:!!fd.get("active"),
    img: pending.pimg !== undefined ? pending.pimg : (old ? old.img || "" : "")};
  if(!data.name) return toast("Nama produk wajib diisi.");
  const pid = id || uid("p");
  const ok = await safe(() => old ? store.update("stores/"+s.id+"/products/"+pid, data) : store.set("stores/"+s.id+"/products/"+pid, Object.assign(data,{createdAt:Date.now()})), "Produk disimpan");
  if(ok){ pending.pimg = undefined; closeModal(); }
}

async function setStatus(oid, status, extra){
  const o = S.orders.find(x=>x.id===oid); if(!o) return;
  const data = Object.assign({status, updatedAt:Date.now()}, extra||{});
  if(status === "selesai") data.doneAt = Date.now();
  if(status === "menunggu_pembayaran") data.proof = "";
  await safe(() => store.update("orders/"+oid, data), "Status: "+STATUS[status].l);
}
async function restock(o){
  const prods = S.products[o.storeId];
  if(!prods) return;
  for(const i of o.items){ const p = prods.find(x=>x.id===i.pid); if(p && typeof p.stock==="number") await safe(()=>store.update("stores/"+o.storeId+"/products/"+p.id,{stock:p.stock+i.qty})); }
}

/* ============ Event ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if(a === "modal-bg"){ if(e.target === el) closeModal(); return; }
  if(a === "pay" || a === "pick-store") return;
  if(el.tagName === "A" && el.getAttribute("href")) return;
  if(a === "go"){ go(v); return; }
  if(a === "logo"){ if(S.role === "seller") go("seller", {sellerTab:"ringkasan"}); else go("home"); return; }
  if(a === "mitra-info"){ openMitraModal(); return; }
  if(a === "nav"){ if(v === "seller") go("seller", {sellerTab: el.dataset.t || "ringkasan"}); else go(v); return; }
  if(a === "preview-store"){ go("store", {storeId:id, preview:true}); return; }
  if(a === "quick-add"){ pending.pimg = undefined; openProdModal(); return; }
  if(a === "share-store"){ const s = storeById(id); if(s) copyText(s.name+" sekarang ada di Jaga Toko! Pesan langsung, gratis ongkir & tanpa biaya admin. Cari \""+s.name+"\" di Jaga Toko."+(s.wa?" WA: "+s.wa:"")); return; }
  if(a === "cat"){ S.cat = (S.cat === v && v !== "Semua") ? "Semua" : v; if(S.view !== "home") go("home"); else render(); return; }
  if(a === "clear-filter"){ S.cat = "Semua"; S.q = ""; document.getElementById("q").value = ""; render(); return; }
  if(a === "open-prod"){ go("product", {prodId:id}); return; }
  if(a === "buy-now"){ const inC = S.cart.items[id] && S.cart.storeId === (findProd(id)||{}).sid; if(!inC) changeQty(id, 1); if(S.cart.items[id]) go("cart"); return; }
  if(a === "slide"){ setSlide(S.slide + Number(v)); return; }
  if(a === "slide-to"){ setSlide(Number(v)); return; }
  if(a === "open-store"){ go("store", {storeId:id}); return; }
  if(a === "open-order"){ go("order", {orderId:id}); return; }
  if(a === "qty"){ changeQty(id, +el.dataset.d); return; }
  if(a === "clear-cart"){ S.cart = {storeId:null, items:{}}; saveCart(); render(); return; }
  if(a === "btab"){ S.buyerTab = v; render(); return; }
  if(a === "stab"){ S.sellerTab = v; render(); return; }
  if(a === "ofilter"){ S.orderFilter = v; render(); return; }
  if(a === "copy"){ copyText(v); return; }
  if(a === "close-modal"){ closeModal(); return; }
  if(a === "edit-prod"){ pending.pimg = undefined; openProdModal(id); return; }
  if(a === "del-prod"){ const sid = S.sellerStoreId; confirmModal("Hapus produk ini?", "Hapus", () => safe(() => store.del("stores/"+sid+"/products/"+id), "Produk dihapus")); return; }
  if(a === "toggle-open"){ const s = storeById(S.sellerStoreId); if(s) safe(() => store.update("stores/"+s.id, {open: s.open === false}), s.open===false?"Toko dibuka":"Toko ditutup sementara"); return; }
  if(a === "del-store"){ const s = storeById(S.sellerStoreId); if(!s) return; confirmModal("Hapus toko "+s.name+"? Toko tidak akan tampil lagi di Jaga Toko.", "Hapus toko", async () => { const ok = await safe(() => store.del("stores/"+s.id), "Toko dihapus"); if(ok){ S.sellerStoreId = null; go("seller"); } }); return; }
  if(a === "set-status"){ setStatus(id, v); return; }
  if(a === "seller-cancel"){ const o = S.orders.find(x=>x.id===id); confirmModal("Tolak/batalkan pesanan "+(o?o.code:"")+"? Jika pembeli sudah membayar, kembalikan dananya.", "Batalkan pesanan", async () => { await setStatus(id, "dibatalkan", {cancelBy:"toko"}); if(o) await restock(o); }); return; }
  if(a === "buyer-cancel"){ const o = S.orders.find(x=>x.id===id); confirmModal("Batalkan pesanan ini?", "Batalkan", async () => { await setStatus(id, "dibatalkan", {cancelBy:"pembeli"}); if(o){ watchProducts(o.storeId); await restock(o); } }); return; }
  if(a === "buyer-done"){ setStatus(id, "selesai"); return; }
  if(a === "send-proof"){
    const f = document.getElementById("proofFile").files[0];
    if(!f) return toast("Pilih foto bukti pembayaran dulu.");
    el.disabled = true;
    try{ const img = await compressImage(f, 900); await setStatus(id, "menunggu_konfirmasi", {proof:img, paidAt:Date.now()}); }
    catch(err){ toast("Gambar tidak bisa dibaca."); }
    el.disabled = false; return;
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(t.name === "pay"){ S.payChoice = t.value; document.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.querySelector("input").checked)); return; }
  if(t.dataset.act === "pick-store"){ S.sellerStoreId = t.value; watchProducts(t.value); render(); return; }
  const map = {logoFile:["logo","logoPrev",300], qrisFile:["qris","qrisPrev",700], pimgFile:["pimg","pimgPrev",600]};
  if(map[t.id] && t.files[0]){
    const [key, prev, max] = map[t.id];
    try{ pending[key] = await compressImage(t.files[0], max); document.getElementById(prev).innerHTML = '<img alt="" src="'+pending[key]+'">'; }
    catch(err){ toast("Gambar tidak bisa dibaca."); }
  }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){
    S.q = e.target.value;
    if(S.view !== "home"){ S.view = "home"; window.scrollTo(0,0); }
    render();
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if(f.id === "hsearch"){ document.getElementById("q").blur(); if(S.view !== "home") go("home"); return; }
  if(f.id === "checkout") placeOrder(f);
  else if(f.id === "storeForm") saveStore(f);
  else if(f.id === "prodForm") saveProduct(f);
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act='go'][data-new]"); if(el){ pending.logo = pending.qris = undefined; }
}, true);

function setSlide(i){
  S.slide = (i + SLIDES.length) % SLIDES.length;
  const sl = document.getElementById("slides"); if(sl) sl.style.transform = "translateX(-"+(S.slide*100)+"%)";
  document.querySelectorAll("#dots button").forEach((b,k) => b.classList.toggle("on", k === S.slide));
}
setInterval(() => { if(S.view === "home" && !document.hidden && document.getElementById("slides")) setSlide(S.slide + 1); }, 5000);

window.addEventListener("hashchange", () => { const r = modeFromHash(); if(r !== S.role){ S.role = r; go(r === "seller" ? "seller" : "home", r === "seller" ? {sellerTab:"ringkasan"} : {}); } });

/* ============ Mulai ============ */
function startListening(){
  const slowT = setTimeout(() => { S.slow = true; render(); }, 10000);
  store.listen("stores", (rows, fromCache) => {
    if(rows){ S.stores = rows.map(r => CAT_ALIAS[r.category] ? Object.assign({}, r, {category:CAT_ALIAS[r.category]}) : r); syncProductSubs(); }
    if(!fromCache){ S.ready.stores = true; S.slow = false; clearTimeout(slowT); }
    else if(rows && rows.length) S.ready.stores = true;
    render();
  });
  store.listen("orders", (rows, fromCache) => {
    if(rows) S.orders = rows;
    if(!fromCache || (rows && rows.length)) S.ready.orders = true;
    render();
  });
}
(async function init(){
  let db = null, user = null;
  if(SB){
    S.mode = "supabase";
    try{ ME = localStorage.getItem("jt_uid") || ""; if(!ME){ ME = uid("u"); localStorage.setItem("jt_uid", ME); } }catch(e){ ME = uid("u"); }
    startListening(); render(); return;
  }
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const t = new Promise(r => setTimeout(() => r(null), 10000));
      [db, user] = await Promise.all([Promise.race([window.claude.use("db"), t]), Promise.race([window.claude.use("user"), t])]);
    }
  }catch(e){ db = null; }
  if(db){
    DB = db; S.mode = "db";
    try{ const i = user ? await user.id() : null; if(i) ME = i; }catch(e){}
  } else {
    S.mode = "local";
    try{ ME = localStorage.getItem("jt_uid") || ""; if(!ME){ ME = uid("u"); localStorage.setItem("jt_uid", ME); } }catch(e){}
  }
  startListening();
  render();
})();
render();
</script>
