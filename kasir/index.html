<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1B2D">
<title>Jaga Kasir · Aplikasi kasir warung, bayar sekali</title>
<meta name="description" content="Aplikasi kasir warung dari JAGA, coba gratis 3 hari lalu bayar sekali: scan barcode atau foto barang, stok otomatis, struk WhatsApp, kasbon, dan laporan tutup toko ke WhatsApp pemilik. Tanpa install, data aman tersimpan online.">
<meta property="og:title" content="Jaga Kasir · Kasir warung siap jualan dalam 10 menit">
<meta property="og:description" content="Barang langsung lengkap dengan foto, stok otomatis, kasbon tertagih, dan laporan tutup toko ke WhatsApp pemilik.">
<meta property="og:type" content="website"><meta property="og:url" content="https://jagapatner.my.id/kasir/"><meta property="og:image" content="https://jagapatner.my.id/kasir/icon-512.png">
<link rel="canonical" href="https://jagapatner.my.id/kasir/">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com/@zxing/library@0.21.3/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.openfoodfacts.org https://tile.openstreetmap.org; connect-src 'self' https://flwajaadllviewenerya.supabase.co https://world.openfoodfacts.org https://images.openfoodfacts.org https://fonts.googleapis.com https://fonts.gstatic.com; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="same-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: satu layar kerja. HP = konten + tab bawah; tablet = rel kiri + dua kolom (pilih barang | keranjang). */
:root{
  --bg:#F6F2EA; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#6B6F78; --line:#E4DCCB;
  --brand:#0F1B2D; --brand-ink:#FFFFFF; --tag:#0F1B2D; --tag-ink:#FFFFFF; --gold:#B08D4F; --gold2:#C9A96A;
  --ok:#3F6B52; --warn:#9A6639; --bad:#A8483F;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --brandfont:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 22px rgba(15,27,45,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--brand);color:var(--brand-ink)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1;white-space:nowrap}
.logo .mk{width:22px;height:29px;flex:none}
.logo b{font-weight:800;letter-spacing:.06em}
.logo span{font-weight:600;opacity:.9}
.top .mk .mk-a{fill:#FFFFFF}.top .mk .mk-b{fill:var(--gold2)}
.mk .mk-a{fill:var(--brand)}.mk .mk-b{fill:var(--gold)}
.top .shop{flex:1;min-width:0;color:var(--brand-ink);opacity:.9;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--ok)}
main{overflow:auto;min-height:0;padding:16px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:7px 2px;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600}
.tabs button[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pay{background:var(--tag);border-color:var(--tag);color:var(--tag-ink);font-size:17px;padding:12px 22px;box-shadow:0 6px 16px rgba(15,27,45,.28)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{display:flex;gap:10px;align-items:flex-start;border:1px dashed color-mix(in srgb,var(--brand) 50%,var(--line));background:color-mix(in srgb,var(--brand) 6%,var(--surface));border-radius:12px;padding:10px 12px;font-size:13px}
.note .btn{min-height:34px;padding:5px 10px;font-size:12.5px}
input[type=text],input[type=tel],input[type=search],input[type=password],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:44px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select{color:var(--ink);font-weight:500;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;min-height:36px}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:2px 0 4px;scrollbar-width:none;flex-shrink:0;min-height:44px}
.seg.scroll button{flex:none}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:14px;color:var(--brand);padding:14px 2px 2px;border-top:1px solid var(--line)}
.cat-h:first-child{border-top:0;padding-top:2px}
.cat-h small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Kasir */
.kasir{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.scanbar{display:flex;gap:8px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px 9px;min-height:68px}
.pic{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--brand) 9%,var(--surface));color:var(--brand);font-family:var(--display);font-weight:800;font-size:26px;margin-bottom:4px}
.pic img,.th img{width:100%;height:100%;object-fit:cover;display:block}
.th{display:flex;align-items:center;justify-content:center;flex:none;width:46px;height:46px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--brand) 9%,var(--surface));color:var(--brand);font-family:var(--display);font-weight:800;font-size:18px}
.th.big{width:84px;height:84px;font-size:30px;border-radius:14px}
.tile b{font-size:13px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.tile>span:last-child{font-size:13.5px;color:var(--ink);font-weight:700;margin-top:auto}
.tile.out{border-style:dashed}
.tile.out>span:last-child{color:var(--bad)}
.tile.out .pic{opacity:.5}
.cart .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{font-weight:600;overflow-wrap:anywhere}
.line .tot{font-weight:700;text-align:right}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:17px}
.qty button.qn{width:auto;min-width:46px;padding:0 6px;border-style:dashed;font-size:15px}
.tabs button{position:relative}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-size:10.5px;font-weight:800;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv.sum{font-weight:800;font-size:16px;border-top:2px solid var(--ink)}
.qris{display:block;width:min(100%,260px);margin:0 auto;border-radius:12px;border:1px solid var(--line);background:#FFFFFF}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.paybar{position:sticky;bottom:-16px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);margin-top:12px}
.paybar .t{flex:1}
.paybar .t small{display:block;color:var(--muted);font-size:12px}
.paybar .t b{font-family:var(--display);font-size:24px;font-weight:800}

/* daftar */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child,.cat-h+.item{border-top:0}
.item .grow b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .r{text-align:right;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{color:var(--muted);font-size:12px;font-weight:600}
.stat b{display:block;font-family:var(--display);font-size:21px;font-weight:800;margin-top:2px}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 2px 4px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);background:linear-gradient(to top,transparent 49.5%,var(--line) 50%,transparent 50.5%)}
.chart div{flex:1;background:color-mix(in srgb,var(--brand) 55%,transparent);border-radius:4px 4px 0 0;min-height:2px}
.chart div.now{background:var(--brand)}
.axis{display:flex;gap:4px;font-size:10.5px;color:var(--muted);margin-top:4px}
.axis span{flex:1;text-align:center;overflow:hidden}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(15,27,45,.5);display:flex;align-items:flex-end;justify-content:center;z-index:90}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.total-big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1}
.change{display:flex;justify-content:space-between;align-items:baseline;border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);font-weight:700}
.change.short{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.change b{font-size:20px}
pre.struk{font:500 12.5px/1.45 var(--mono);background:#FFFFFF;color:#111111;border:1px solid var(--line);border-radius:10px;padding:14px 12px;margin:0 auto;overflow-x:auto;width:fit-content;max-width:100%}
#toast{pointer-events:none;position:fixed;left:50%;top:62px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:99;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

/* scanner */
.scan{position:fixed;inset:0;z-index:92;background:#05080F;color:#FFFFFF;display:flex;flex-direction:column}
.scan-top{display:flex;align-items:center;gap:8px;padding:10px 12px}
.scan-top b{flex:1;font-family:var(--display);font-size:17px}
.scan .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#FFFFFF}
.scan-view{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scan-view video{width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;width:min(78%,360px);height:150px;border:3px solid #FFFFFF;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.reticle{overflow:hidden;transition:border-color .15s}
.reticle::before{content:"";position:absolute;left:6%;right:6%;top:6%;height:3px;border-radius:3px;background:#FF3B4E;box-shadow:0 0 14px 3px rgba(255,59,78,.85);animation:laser 1.5s ease-in-out infinite alternate}
@keyframes laser{from{top:6%}to{top:92%}}
.reticle.hit{border-color:#3BE38B}
.reticle.hit::before{background:#3BE38B;box-shadow:0 0 14px 3px rgba(59,227,139,.85)}
.reticle.hit::after{content:"";position:absolute;inset:0;background:rgba(59,227,139,.4);animation:flash .45s ease-out forwards}
.reticle.miss{border-color:#FFB020}
@keyframes flash{from{opacity:1}to{opacity:0}}
.scan-pop{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;background:#FFFFFF;color:#2A1114;border-radius:14px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:pop .22s ease-out;z-index:2}
.scan-pop b{display:block;overflow-wrap:anywhere}
.scan-pop .q{margin-left:auto;font-family:var(--display);font-weight:800;font-size:20px;color:#12804A;white-space:nowrap}
@keyframes pop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reticle::before,.reticle.hit::after,.scan-pop{animation:none}}
.scan-msg{position:absolute;left:16px;right:16px;text-align:center;top:50%;transform:translateY(-50%);margin:0;font-weight:600}
.scan-foot{padding:12px;display:flex;flex-direction:column;gap:8px;background:#0B1120}
.scan-foot input{background:#141C31;border-color:#26314E;color:#FFFFFF}
.scan-last{display:flex;justify-content:space-between;gap:10px;font-weight:600;min-height:22px}
.scan.cart .scan-view{flex:0 0 38%;min-height:190px}
.scan.cart .reticle{height:110px}
.scan-panel{flex:1;min-height:0;display:flex;flex-direction:column;background:#0B1120}
.scan-list{flex:1;min-height:0;overflow:auto;padding:4px 12px}
.sl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid #1E2944}
.sl-row.new{animation:slnew .9s ease-out}
@keyframes slnew{from{background:rgba(59,227,139,.22)}to{background:transparent}}
.sl-row .nm{font-weight:700;overflow-wrap:anywhere}
.sl-row .sub{font-size:12.5px;color:#9AA6C6}
.sl-row .tot{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.sl-ctl{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.sl-ctl button{width:34px;height:34px;border-radius:9px;border:1px solid #2C3858;background:#141C31;color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sl-ctl button.x{border-color:#5B2630;color:#FF7A6E}
.sl-ctl input{width:54px;height:34px;min-height:34px;padding:4px;text-align:center;border-radius:9px;background:#141C31;border:1px solid #2C3858;color:#fff;font-weight:800;font-size:15px}
.sl-row.fail{grid-template-columns:minmax(0,1fr) auto}
.sl-row.fail .nm{color:#FF7A6E}
.sl-row.fail .sl-ctl .btn{width:auto;min-height:34px;padding:4px 10px;font-size:12.5px;background:#141C31;border:1px solid #2C3858;color:#fff}
.scan .btn.pay{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.scan .btn.pay:disabled{opacity:.4}
.sl-empty{color:#9AA6C6;text-align:center;padding:22px 8px;font-size:14px}
.scan-tot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid #1E2944;background:#0E1630}
.scan-tot .grow small{display:block;color:#9AA6C6;font-size:12px;font-weight:600}
.scan-tot .grow b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.scan-tot .btn.pay{min-width:120px}
.scan-man{display:flex;gap:8px;padding:0 12px 12px;background:#0E1630}
.scan-man input{background:#141C31;border-color:#26314E;color:#fff;flex:1;min-width:0}
.scan-man .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}

#print-area{display:none}
.estruk{display:block;width:min(100%,320px);margin:0 auto;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:4px 0 6px}
.login-head .mk{width:58px;height:76px}
.login-head .word{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;letter-spacing:.02em}
.login-head .word b{color:var(--brand);letter-spacing:.06em}
.login h1{font-size:19px;font-weight:700;margin:6px 0 0}
.login-head p{margin:0;color:var(--muted);max-width:30ch}
.login-card .note{align-items:center}
.lg-err{color:var(--bad);font-weight:600;font-size:13px}
.lg-err:empty{display:none}
.lg-ok{color:var(--ok);font-weight:600;font-size:13.5px;background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:10px;padding:10px 12px}
.lg-links{display:flex;flex-direction:column;gap:2px;align-items:center}
.lg-links .btn{min-height:40px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)}.sync.wait i{background:var(--warn)}.sync.err i{background:var(--bad)}
.own{position:fixed;inset:0;z-index:85;background:var(--bg);overflow:auto;padding:0 0 30px}
.own .top{position:sticky;top:0;z-index:2}
.own-body{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.acc{display:flex;flex-direction:column;gap:8px}
.acc .row b{font-size:15.5px}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  #print-area pre{font:600 11px/1.35 var(--mono);margin:0;color:#000}
  @page{margin:2mm}
}

const Store={
  idb:null, mode:'memori', mem:{}, late:null,
  // kunci kecil penting (sesi, akun, kunci perangkat, status sinkron) disimpan ganda: IndexedDB + localStorage
  keep:k=>/(_session|_account_|_devkey|_owner_key|_rev_|_dirty_|_at_|_fq_|_fd_)/.test(k),
  async init(){
    const open=new Promise((res,rej)=>{try{const rq=indexedDB.open('jaga-kasir',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);rq.onblocked=()=>{}}catch(e){rej(e)}});
    try{this.idb=await Promise.race([open,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);this.mode='perangkat'}
    catch(e){open.then(db=>{this.idb=db;this.mode='perangkat'}).catch(()=>{});
      try{localStorage.setItem('jks_t','1');localStorage.removeItem('jks_t');this.mode='perangkat'}catch(e2){this.mode='memori'}}
  },
  async get(k){
    if(this.idb){try{const v=await new Promise((res,rej)=>{const r=this.idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v!==undefined&&v!==null)return v}catch(e){}}
    try{const v=localStorage.getItem(k);if(v!=null){const x=JSON.parse(v);if(this.idb&&x!=null)this.set(k,x);return x}}catch(e){}
    return this.mem[k];
  },
  async set(k,v){
    this.mem[k]=v;
    if(this.keep(k)||!this.idb){try{if(v===null||v===undefined||v==='')localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
    if(this.idb){try{await new Promise((res,rej)=>{const t=this.idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});return}catch(e){}}
    try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
  }
};

async function rpc(fn,args,ms){
  if(FRAMED) throw Object.assign(new Error('Akun online aktif setelah aplikasi dipasang di situs.'),{offline:true});
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||20000);
  let r;
  try{r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',signal:ctl.signal,headers:{'apikey':SB.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})})}
  catch(e){throw Object.assign(new Error('Tidak ada sambungan internet. Coba lagi.'),{offline:true})}
  finally{clearTimeout(t)}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=(d&&(d.message||d.hint))||'';
    if(/SESI_HABIS/.test(m)) throw Object.assign(new Error('Sesi berakhir. Silakan masuk lagi.'),{expired:true});
    if(/BUKAN_PEMILIK/.test(m)) throw Object.assign(new Error('Sesi pemilik berakhir. Silakan masuk lagi.'),{owner:true});
    throw new Error(d&&d.hint||'Server sedang bermasalah. Coba lagi sebentar.')}
  return d;
}

function commitSale(){

const lr=(a,b,w)=>{a=String(a);b=String(b);const sp=w-a.length-b.length;return sp>=1?a+' '.repeat(sp)+b:a.slice(0,Math.max(0,w-b.length-1))+' '+b};
function wrap(t,w){const out=[];let cur='';String(t).split(/\s+/).forEach(x=>{while(x.length>w){if(cur){out.push(cur);cur=''}out.push(x.slice(0,w));x=x.slice(w)}
  if(!cur)cur=x;else if((cur+' '+x).length<=w)cur+=' '+x;else{out.push(cur);cur=x}});if(cur)out.push(cur);return out}
function receiptLines(s,w){
  const L=[],sep='-'.repeat(w),add=(t,o)=>L.push(Object.assign({t},o||{}));
  const nm=S.shop.name||'Warung';
  if(nm.length<=w/2) add(nm,{a:'c',big:1,b:1}); else wrap(nm,w).forEach(x=>add(x,{a:'c',b:1}));
  if(S.shop.address) wrap(S.shop.address,w).forEach(x=>add(x,{a:'c'}));
  if(S.shop.phone) add('Telp/WA '+S.shop.phone,{a:'c'});
  add(sep); add(lr('No '+s.no,fmtDate(s.ts)+' '+fmtTime(s.ts),w)); if(s.by) add('Kasir: '+s.by); add(sep);
  s.items.forEach(i=>{wrap(i.name,w).forEach(x=>add(x));add(lr('  '+i.qty+' x '+fmt(i.price),fmt(i.qty*i.price),w))});
  add(sep);
  if(s.disc){add(lr('Subtotal',fmt(s.subtotal),w));add(lr('Potongan','-'+fmt(s.disc),w))}
  add(lr('TOTAL','Rp'+fmt(s.total),w),{b:1});
  if(s.method==='tunai'){add(lr('Tunai',fmt(s.cash),w));add(lr('Kembali',fmt(s.change),w))}
  else if(s.method==='kasbon'){add(lr('KASBON',s.cust,w));add(s.lunas?'Lunas '+fmtDate(s.lunas):'Belum lunas')}
  else add(lr('Bayar',s.method==='qris'?'QRIS':'Transfer',w));
  if(s.void) add('*** DIBATALKAN ***',{a:'c',b:1});
  add(sep);
  if(S.shop.footer) wrap(S.shop.footer,w).forEach(x=>add(x,{a:'c'}));
  add('Jaga Kasir',{a:'c'});
  return L;
}
const receiptText=(s,w)=>receiptLines(s,w).map(l=>l.a==='c'?' '.repeat(Math.max(0,Math.floor((w-l.t.length)/2)))+l.t:l.t).join('\n');
const width=()=>S.shop.paper===80?48:32;
const ascii=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,'?');
function escpos(s){
  const b=[0x1B,0x40];
  receiptLines(s,width()).forEach(l=>{b.push(0x1B,0x61,l.a==='c'?1:0,0x1B,0x45,l.b?1:0,0x1D,0x21,l.big?0x11:0);for(const ch of ascii(l.t))b.push(ch.charCodeAt(0));b.push(0x0A)});
  b.push(0x1B,0x61,0,0x1D,0x21,0,0x0A,0x0A,0x0A,0x0A); if(S.shop.paper===80) b.push(0x1D,0x56,66,0);
  return new Uint8Array(b);
}
let curSale=null;
const pending=()=>S?S.sales.filter(s=>s.printed===null&&!s.void).sort((a,b)=>a.ts-b.ts):[];
const printStatus=s=>s.void?'Transaksi dibatalkan':s.printed?'Sudah dicetak '+fmtTime(s.printed):PR.ch?'Belum dicetak':'Struk elektronik tersimpan. Bisa dicetak kapan saja setelah printer tersambung.';
function markPrinted(s){s.printed=Date.now();save();const e=$('#estruk-st');if(e&&curSale===s)e.textContent=printStatus(s);render()}
function eReceipt(s){
  const k=2,W=32,mono='13px ui-monospace,"Courier New",monospace',L=receiptLines(s,W),i0=Math.max(0,L.findIndex(l=>/^-+$/.test(l.t))),body=L.slice(i0+1);
  const c=document.createElement('canvas'),x=c.getContext('2d');x.font=mono;
  const pad=18,w=Math.ceil(x.measureText('0').width*W+pad*2),nm=wrap(S.shop.name||'Warung',18);
  const sub=[S.shop.address,S.shop.phone?'Telp/WA '+S.shop.phone:''].filter(Boolean).flatMap(t=>wrap(t,36));
  const bandH=22+nm.length*26+sub.length*16+12,h=bandH+14+body.length*19+34;
  c.width=w*k;c.height=h*k;x.scale(k,k);x.fillStyle='#FFFFFF';x.fillRect(0,0,w,h);x.fillStyle='#0F1B2D';x.fillRect(0,0,w,bandH);x.fillStyle='#C9A96A';x.fillRect(0,bandH-3,w,3);
  x.textAlign='center';x.textBaseline='top';x.fillStyle='#FFFFFF';let y=18;
  x.font='800 22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';nm.forEach(t=>{x.fillText(t,w/2,y);y+=26});
  x.font='500 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';sub.forEach(t=>{x.fillText(t,w/2,y+2);y+=16});
  y=bandH+14;
  body.forEach(l=>{x.font=(l.b?'700 ':'400 ')+mono;x.fillStyle=/DIBATALKAN/.test(l.t)?'#C0352B':'#111111';x.textAlign=l.a==='c'?'center':'left';x.fillText(l.t,l.a==='c'?w/2:pad,y);y+=19});
  x.textAlign='center';x.fillStyle='#6B6F78';x.font='500 11px system-ui,sans-serif';x.fillText('Struk elektronik',w/2,y+8);
  return c.toDataURL('image/png');
}
const dataBlob=u=>{const i=u.indexOf(','),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new Blob([a],{type:u.slice(5,u.indexOf(';'))})};
const canShareFiles=()=>{try{return !FRAMED&&!!navigator.canShare&&navigator.canShare({files:[new File([''],'a.png',{type:'image/png'})]})}catch(e){return false}};

/* ---- printer Bluetooth (ESC/POS) ---- */
const PR={dev:null,ch:null,name:''};
const BT_SVC=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb'];
const btSupported=()=>!!(navigator.bluetooth&&navigator.bluetooth.requestDevice)&&!FRAMED;
async function btAttach(dev){
  const srv=await dev.gatt.connect(); let ch=null;
  for(const sv of await srv.getPrimaryServices()){for(const c of await sv.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break}}if(ch)break}
  if(!ch){dev.gatt.disconnect();throw new Error('Perangkat ini tidak dikenali sebagai printer struk')}
  PR.dev=dev;PR.ch=ch;PR.name=dev.name||'Printer';
  if(!dev._jk){dev._jk=1;dev.addEventListener('gattserverdisconnected',()=>{PR.ch=null;render();toast('Printer terputus. Disambung lagi saat mencetak.')})}
}
async function btConnect(){await btAttach(await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SVC}))}
async function btWrite(bytes){
  for(let i=0;i<bytes.length;i+=100){const part=bytes.slice(i,i+100);
    if(PR.ch.properties.writeWithoutResponse) await PR.ch.writeValueWithoutResponse(part); else await PR.ch.writeValue(part);
    await sleep(25)}
}
const printBt=s=>btWrite(escpos(s));

async function ensureDecoder(){
  if(SC.det||SC.zx) return;
  if('BarcodeDetector' in window){try{const want=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];
    const have=await BarcodeDetector.getSupportedFormats();const f=want.filter(x=>have.includes(x));if(f.length){SC.det=new BarcodeDetector({formats:f});return}}catch(e){}}
  if(!window.ZXing){try{await loadScript('vendor/zxing.min.js')}catch(e){await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js')}}
  const Z=window.ZXing, hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.MultiFormatReader(); reader.setHints(hints); SC.zx=reader; SC.canvas=document.createElement('canvas');
}
function zxDecode(){
  const v=SC.video,Z=window.ZXing; if(!v.videoWidth) return [];
  const sc=Math.min(1,800/v.videoWidth),c=SC.canvas; c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
  c.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,c.width,c.height);
  try{return [SC.zx.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()]}catch(e){return []}
}

    o.type=ok?'square':'sawtooth';o.frequency.value=ok?1760:240;g.gain.setValueAtTime(ok?.16:.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(SC.ac.destination);o.start(t);o.stop(t+d)}catch(e){}

async function scanLoop(){
  while(SC.on){
    let codes=[];
    if(!SC.cont||SC.mode==='barcode')try{codes=SC.det?(await SC.det.detect(SC.video)).map(c=>c.rawValue):zxDecode()}catch(e){}
    if(SC.cont&&SC.mode!=='barcode'){await sleep(250);continue}
    const c=codes[0], now=Date.now();
    if(c){const same=c===SC.last&&now-SC.lastT<900;SC.last=c;SC.lastT=now;if(!same)SC.cb(c)}
    await sleep(SC.det?110:170);
  }
}

    (m==='foto'?'<div class="fguide" aria-hidden="true"></div><div class="cands" id="cands" hidden></div><button class="shot" data-act="snap" id="shot" aria-label="Foto barang"></button><label class="btn galbtn" for="foto-file">Galeri</label><input type="file" id="foto-file" accept="image/*" hidden>':'<div class="reticle" id="reticle"></div>')+

/* VIS: pengenal barang dari foto (tanpa server). Sidik foto = histogram warna berbobot tengah + tata letak warna + arah tepi. */
const VIS={N:64,c:null,
  draw(src,cam){const N=VIS.N,c=VIS.c||(VIS.c=document.createElement('canvas'));c.width=N;c.height=N;const x=c.getContext('2d',{willReadFrequently:true});
    const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;x.fillStyle='#fff';x.fillRect(0,0,N,N);
    if(cam){const s=Math.min(w,h)*.78;x.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,N,N)}
    else{const k=N/Math.max(w,h);x.drawImage(src,0,0,w,h,(N-w*k)/2,(N-h*k)/2,w*k,h*k)}
    return x.getImageData(0,0,N,N).data},
  feat(src,cam){const N=VIS.N,d=VIS.draw(src,cam),HB=12;
    const A=new Float32Array(HB*2+4),L=new Float32Array(27),E=new Float32Array(32),lw=new Float32Array(9),gray=new Float32Array(N*N);
    // normalisasi terang: bagi dengan rata-rata kecerahan bagian tengah supaya lampu redup/terang tidak terlalu berpengaruh
    let mean=0,mc=0;for(let y=N/4;y<N*3/4;y++)for(let x=N/4;x<N*3/4;x++){const i=(y*N+x)*4;mean+=(d[i]+d[i+1]+d[i+2])/3;mc++}mean=mean/mc||128;const gain=Math.min(1.6,Math.max(.7,140/mean));
    const sg=2*(N*.36)*(N*.36),bq=(r,g,b)=>((r*7.99|0)*64+(g*7.99|0)*8+(b*7.99|0)),BF=new Float32Array(512);
    if(cam){let bn=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(x>3&&x<N-4&&y>3&&y<N-4)continue;const i=(y*N+x)*4;BF[bq(d[i]/255,d[i+1]/255,d[i+2]/255)]++;bn++}for(let i=0;i<512;i++)BF[i]/=bn}
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=(y*N+x)*4;let r=Math.min(255,d[i]*(cam?gain:1))/255,g=Math.min(255,d[i+1]*(cam?gain:1))/255,b=Math.min(255,d[i+2]*(cam?gain:1))/255;
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx,s=mx?(mx-mn)/mx:0;gray[y*N+x]=(r+g+b)/3;
      const dx=x-N/2+.5,dy=y-N/2+.5;let w=Math.exp(-(dx*dx+dy*dy)/sg);if(cam)w*=1-Math.min(.9,BF[bq(d[i]/255,d[i+1]/255,d[i+2]/255)]*14);if(v>.9&&s<.1)w*=.12;
      if(s>=.22&&v>=.18){let hh=0;const dd=mx-mn;if(mx===r)hh=((g-b)/dd+6)%6;else if(mx===g)hh=(b-r)/dd+2;else hh=(r-g)/dd+4;hh=hh/6*HB;
        const h0=Math.floor(hh)%HB,h1=(h0+1)%HB,f=hh-Math.floor(hh),so=s>.55?HB:0;A[h0+so]+=w*(1-f);A[h1+so]+=w*f}
      else A[HB*2+Math.min(3,Math.floor(v*4))]+=w;
      const cx=Math.min(2,Math.floor(x*3/N)),cy=Math.min(2,Math.floor(y*3/N)),k=cy*3+cx;L[k*3]+=r+g+b;L[k*3+1]+=r-g;L[k*3+2]+=(r+g)/2-b;lw[k]++}
    for(let k=0;k<9;k++){L[k*3]/=lw[k]*3;L[k*3+1]/=lw[k];L[k*3+2]/=lw[k]}
    let lm=0;for(let k=0;k<9;k++)lm+=L[k*3];lm/=9;for(let k=0;k<9;k++)L[k*3]-=lm;
    for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const gx=gray[y*N+x+1]-gray[y*N+x-1],gy=gray[(y+1)*N+x]-gray[(y-1)*N+x],m=Math.hypot(gx,gy);if(m<.04)continue;
      let a=Math.atan2(gy,gx);if(a<0)a+=Math.PI;const o=Math.min(7,Math.floor(a/Math.PI*8)),q=(y<N/2?0:2)+(x<N/2?0:1);E[q*8+o]+=m}
    const nz=(a,wt)=>{let s=0;for(const v of a)s+=v*v;s=Math.sqrt(s)||1;for(let i=0;i<a.length;i++)a[i]=a[i]/s*wt;return a};

    for(let i=0;i<A.length;i++)A[i]=Math.sqrt(A[i]);
    nz(A,1);nz(L,.55);nz(E,.6);const out=new Float32Array(A.length+L.length+E.length);out.set(A,0);out.set(L,A.length);out.set(E,A.length+L.length);return nz(out,1)},
  sim(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s}
};

VIS.ref={};VIS.learnt=null;
async function visLoadLearnt(){if(!VIS.learnt){try{VIS.learnt=(await Store.get('jk_vis_'+(SESS||'x')))||{}}catch(e){VIS.learnt={}}}return VIS.learnt}
const visHasLearnt=()=>!!VIS.learnt&&Object.keys(VIS.learnt).some(k=>VIS.learnt[k].length&&prod(k));
const visSig=p=>p.img?p.img.length+':'+p.img.slice(-24):'';
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();if(!/^data:/.test(src))i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function visPrepare(){await visLoadLearnt();const l=S.products.filter(p=>p.img);let n=0;
  for(const p of l){const sg=visSig(p),r=VIS.ref[p.id];if(!r||r.sig!==sg){try{VIS.ref[p.id]={sig:sg,f:VIS.feat(await loadImg(p.img),false)}}catch(e){VIS.ref[p.id]={sig:sg,f:null}}if(++n%6===0)await sleep(0)}}
  return l.length}
function visRank(f){const out=[];for(const p of S.products){let s=-1;const r=VIS.ref[p.id];if(r&&r.f&&p.img)s=VIS.sim(f,r.f);const L=(VIS.learnt||{})[p.id];if(L)for(const a of L)s=Math.max(s,VIS.sim(f,a)-.02);if(s>0)out.push({p,s})}return out.sort((a,b)=>b.s-a.s)}
async function visLearn(f,pid){if(!f||!pid)return;await visLoadLearnt();const L=VIS.learnt[pid]=VIS.learnt[pid]||[];L.push(Array.from(f,v=>Math.round(v*1e4)/1e4));while(L.length>6)L.shift();try{await Store.set('jk_vis_'+(SESS||'x'),VIS.learnt)}catch(e){}}
function zxCanvas(c){const Z=window.ZXing;if(!SC.zx||!Z)return null;try{return SC.zx.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText()}catch(e){return null}}
async function snapFoto(src){
  src=src||SC.video;const w=src&&(src.videoWidth||src.naturalWidth||src.width);if(!w)return toast('Kamera belum siap. Tunggu sebentar atau pakai Galeri.');
  const sh=$('#shot');if(sh)sh.disabled=true;const v=$('.scan-view');if(v){v.classList.remove('flash');void v.offsetWidth;v.classList.add('flash')}
  try{
    const h=src.videoHeight||src.naturalHeight||src.height,k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    let code=null;try{await ensureDecoder();code=SC.det?(((await SC.det.detect(c))[0])||{}).rawValue:zxCanvas(c)}catch(e){}
    if(code&&byCode(code)){candHide();onCartScan(code);return}
    await visPrepare();const f=VIS.feat(c,true),R=visRank(f);SC.lastF=f;SC.lastAuto=null;
    if(!R.length){beep(false);candShow(null,[]);return}
    const top=R[0];
    if(top.s>=.75&&(R.length<2||top.s-R[1].s>=.06)){
      addToCart(top.p.id);const cc=S.cart.find(x=>x.pid===top.p.id);SC.newKey=cc?cc.key:'';SC.lastAuto=top.p.id;beep(true);
      scanFx(true,'<span class="th">'+pict(top.p)+'</span><div><b>'+esc(top.p.name)+'</b><span class="small num">'+rp(top.p.sell)+' · dikenali dari foto</span></div><span class="q num">×'+(cc?cc.qty:1)+'</span>');scanInfo(top.p.name);
      candShow(top.p,R.slice(1,5).map(x=>x.p))}
    else{beep(false);candShow(null,R.slice(0,5).map(x=>x.p))}
  }finally{const s2=$('#shot');if(s2)s2.disabled=false}
}

/* ---- Open Food Facts: basis data produk terbuka (foto & data berlisensi CC BY-SA) ---- */
const OFF={base:'https://world.openfoodfacts.org',f:'code,product_name,brands,quantity,categories_tags,image_front_url,image_front_small_url'};
const OFFCAT=[['instant-noodles','Mi Instan'],['noodles','Mi Instan'],['coffees','Kopi'],['teas','Minuman'],['milks','Susu'],['dairies','Susu'],['waters','Minuman'],['beverages','Minuman'],['biscuits','Makanan Ringan'],['crisps','Makanan Ringan'],['chips','Makanan Ringan'],['snacks','Makanan Ringan'],['confectioneries','Makanan Ringan'],['sauces','Bumbu Dapur'],['condiments','Bumbu Dapur'],['oils','Minyak Goreng'],['breads','Roti'],['cigarettes','Rokok']];
function offMap(x){let n=(x.product_name||'').trim();const b=(x.brands||'').split(',')[0].trim();const sq=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');if(b&&!sq(n).includes(sq(b))&&!sq(b).includes(sq(n.split(' ')[0])))n=b.replace(/\b\w/g,c=>c.toUpperCase())+' '+n;n=n.charAt(0).toUpperCase()+n.slice(1);if(x.quantity&&!n.toLowerCase().includes(String(x.quantity).toLowerCase()))n+=' '+x.quantity;
  let code=String(x.code||'');while(code.length>12&&code[0]==='0')code=code.slice(1);const t=x.categories_tags||[];let cat='';for(const [k,v] of OFFCAT)if(t.some(y=>y.endsWith(':'+k))){cat=v;break}
  return {code,name:n.replace(/\s+/g,' ').trim(),cat,photoUrl:x.image_front_url||x.image_front_small_url||'',thumb:x.image_front_small_url||x.image_front_url||''}}
async function offFetch(path){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(OFF.base+path,{signal:ctl.signal});if(!r.ok)throw 0;return await r.json()}catch(e){throw new Error('Open Food Facts tidak bisa dihubungi. Periksa internet.')}finally{clearTimeout(t)}}
async function offGet(code){if(!/^\d{8,14}$/.test(code||''))return null;try{const d=await offFetch('/api/v2/product/'+code+'.json?fields='+OFF.f);if(d.status!==1||!d.product||!d.product.product_name)return null;const o=offMap(d.product);o.code=code;return o}catch(e){return null}}
async function offSearch(q){const d=await offFetch('/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&tagtype_0=countries&tag_contains_0=contains&tag_0=indonesia&json=1&page_size=24&fields='+OFF.f);return (d.products||[]).filter(x=>x.product_name).map(offMap)}
async function urlToData(url,max){if(!url)return null;try{const r=await fetch(url);if(!r.ok)throw 0;return await shrinkFit(await r.blob(),max||520,.8)}catch(e){return null}}

function shrinkFit(file,max,qual){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',qual))}catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const side=Math.min(im.naturalWidth,im.naturalHeight*4/3),h=side*3/4,c=document.createElement('canvas');c.width=360;c.height=270;
    c.getContext('2d').drawImage(im,(im.naturalWidth-side)/2,(im.naturalHeight-h)/2,side,h,0,0,360,270);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))}catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}

let lp=7;
function report(days){
  const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-(days-1));
  const ss=liveSales().filter(s=>s.ts>=start.getTime());
  const r={omzet:0,laba:0,n:ss.length,by:{},top:{},series:[]};
  const perDay={};
  ss.forEach(s=>{r.omzet+=s.total;r.laba+=s.items.reduce((a,i)=>a+(i.price-(i.buy||0))*i.qty,0)-s.disc;r.by[s.method]=(r.by[s.method]||0)+s.total;
    perDay[dayKey(s.ts)]=(perDay[dayKey(s.ts)]||0)+s.total;
    s.items.forEach(i=>{const tk=i.pid||'m:'+i.name,t=r.top[tk]=r.top[tk]||{name:i.name,qty:0,total:0};t.qty+=i.qty;t.total+=i.qty*i.price})});
  for(let d=0;d<days;d++){const x=new Date(start);x.setDate(start.getDate()+d);r.series.push({d:x,v:perDay[dayKey(x.getTime())]||0})}
  r.keluar=S.expenses.filter(e=>e.ts>=start.getTime()).reduce((a,e)=>a+e.amount,0);
  r.topList=Object.values(r.top).sort((a,b)=>b.qty-a.qty).slice(0,5);
  return r;
}

/* ---- tutup toko ---- */
function shiftNow(){const k=dayKey(Date.now()),cl=(S.closings||[]).filter(c=>dayKey(c.ts)===k),last=cl[cl.length-1];
  const since=last?last.ts:new Date(new Date().setHours(0,0,0,0)).getTime(),start=last?last.counted:(S.modal[k]||0);
  const ss=S.sales.filter(s=>s.ts>since),live=ss.filter(s=>!s.void),sum=f=>live.filter(f).reduce((a,s)=>a+s.total,0);
  const tunai=sum(s=>s.method==='tunai'),qris=sum(s=>s.method==='qris'),transfer=sum(s=>s.method==='transfer'),kasbon=sum(s=>s.method==='kasbon');
  const lunas=liveSales().filter(s=>s.method==='kasbon'&&s.lunas&&s.lunas>since).reduce((a,s)=>a+s.total,0);
  const keluar=S.expenses.filter(e=>e.ts>since).reduce((a,e)=>a+e.amount,0);
  return {since,start,n:live.length,omzet:tunai+qris+transfer+kasbon,tunai,qris,transfer,kasbon,lunas,keluar,voids:ss.filter(s=>s.void).length,expected:start+tunai+lunas-keluar}}
function closeShopSheet(){const r=shiftNow();
  sheet('<div class="hd"><h2>Tutup toko</h2><button class="btn ghost" data-act="close" aria-label="Tutup">'+ico('x')+'</button></div>'+
    '<p class="muted small" style="margin:0">Sejak '+fmtTime(r.since)+(dayKey(r.since)!==dayKey(Date.now())?' '+fmtDate(r.since):'')+' · '+r.n+' transaksi · dijaga '+esc(WHO?WHO.name:'pemilik')+'</p>'+
    '<div><div class="kv"><span>Omzet</span><b class="num">'+rp(r.omzet)+'</b></div><div class="kv"><span>Tunai</span><b class="num">'+rp(r.tunai)+'</b></div><div class="kv"><span>QRIS</span><b class="num">'+rp(r.qris)+'</b></div><div class="kv"><span>Transfer</span><b class="num">'+rp(r.transfer)+'</b></div><div class="kv"><span>Kasbon baru</span><b class="num">'+rp(r.kasbon)+'</b></div>'+
    '<div class="kv"><span>Modal / uang awal laci</span><b class="num">'+rp(r.start)+'</b></div><div class="kv"><span>Kasbon dibayar</span><b class="num">'+rp(r.lunas)+'</b></div><div class="kv"><span>Pengeluaran</span><b class="num">'+rp(-r.keluar)+'</b></div>'+
    '<div class="kv sum"><span>Uang di laci seharusnya</span><span class="num" id="cs-exp" data-v="'+r.expected+'">'+rp(r.expected)+'</span></div></div>'+
    '<label class="f">Uang di laci sekarang (hitung)<input type="text" inputmode="numeric" data-rp id="cs-count" placeholder="0" autocomplete="off" autofocus></label><div class="change" id="cs-diff" hidden></div>'+

    '<button class="btn pay block" data-act="close-save">Simpan tutup toko</button>')}

const mapsUrl=(lat,lng)=>'https://www.google.com/maps?q='+lat+','+lng;
function locCard(){if(!isAcc()||!ACC)return '';const has=ACC.lat!=null&&ACC.lng!=null;
  return '<div class="card stack" id="loc-card"><h3>Lokasi warung</h3><p class="muted" style="margin:0">'+(has?'Titik warung tersimpan: <a href="'+mapsUrl(ACC.lat,ACC.lng)+'" target="_blank" rel="noopener" class="num">'+(+ACC.lat).toFixed(5)+', '+(+ACC.lng).toFixed(5)+'</a>. Tim JAGA memakai titik ini untuk kunjungan pendampingan dan dukungan.':'Tandai titik warung supaya tim JAGA bisa menemukan warung Anda untuk kunjungan pendampingan dan dukungan. Lakukan saat Anda berada di warung.')+'</p>'+
    '<div class="row"><button class="btn '+(has?'':'primary')+'" data-act="loc-set">'+(has?'Perbarui dari lokasi sekarang':'Tandai lokasi warung sekarang')+'</button>'+(has?'<button class="btn ghost danger" data-act="loc-del">Hapus titik</button>':'')+'</div></div>'}
function locSet(){if(!navigator.geolocation)return toast('Perangkat ini tidak bisa membaca lokasi.');toast('Membaca lokasi…');
  navigator.geolocation.getCurrentPosition(async p=>{const {latitude:lat,longitude:lng,accuracy}=p.coords;
    try{const r=await rpc('jk_set_location',{p_key:await devKey(),p_lat:lat,p_lng:lng});if(!r.ok)return toast(r.error);ACC.lat=lat;ACC.lng=lng;S.locAsk=1;save();render();toast('Lokasi warung tersimpan'+(accuracy>150?' (akurasi sekitar '+Math.round(accuracy)+' m, coba lagi di luar ruangan bila kurang tepat).':'.'))}catch(e){toast(e.message)}},
    e=>toast(e.code===1?'Izin lokasi ditolak. Izinkan akses lokasi untuk situs ini di pengaturan browser.':'Lokasi belum terbaca. Coba lagi di dekat jendela atau di luar ruangan.'),{enableHighAccuracy:true,timeout:20000,maximumAge:60000})}

let WZ=null;const WZPH={};
const normN=t=>String(t||'').toLowerCase().replace(/\s+/g,' ').trim();
async function wzFetch(){return (await rpc('jk_cat_all',{},30000))||[]}
async function wzPhotos(ids){const need=ids.filter(id=>!(id in WZPH));if(!need.length)return;need.forEach(id=>WZPH[id]=null);
  for(let i=0;i<need.length;i+=60){try{const r=await rpc('jk_cat_photos_pub',{p_ids:need.slice(i,i+60)},30000)||{};Object.assign(WZPH,r)}catch(e){need.slice(i,i+60).forEach(id=>delete WZPH[id])}}

async function wizard(){WZ={rows:[],q:'',c:'',sel:{},step:1,lim:48};

  if(!$('#sheet-root .sheet')||!WZ)return;

const Sync={state:'idle',at:null,err:'',timer:null,busy:false,dirty:false,rev:0,
  html(){const st=this.state,c=st==='ok'?'ok':st==='saving'?'wait':st==='offline'||st==='err'?'err':'wait';
    const t=st==='ok'?'Tersimpan online '+(this.at?fmtTime(this.at):''):st==='saving'?'Menyimpan online…':st==='offline'?'Belum tersimpan online: menunggu internet':st==='err'?'Belum tersimpan online: '+this.err:this.dirty?'Menunggu disimpan online':'Siap';
    return '<span class="sync '+c+'"><i></i>'+esc(t)+'</span>'},
  show(){const e=$('#sync-line');if(e)e.innerHTML=this.html()},
  async load(){this.rev=(await Store.get('jk_rev_'+SESS))||0;this.dirty=!!(await Store.get('jk_dirty_'+SESS));this.at=(await Store.get('jk_at_'+SESS))||null;this.state=this.dirty?'idle':'ok'},
  touch(){if(!isAcc())return;this.ver=(this.ver||0)+1;this.dirty=true;Store.set('jk_dirty_'+SESS,true);this.show();clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),4000)},
  async push(force){
    if(!isAcc()||this.busy)return; if(!this.dirty&&!force)return;
    this.busy=true;this.state='saving';this.show();const sess=SESS,ver=this.ver||0;
    try{
      const r=await rpc('jk_backup_put',{p_key:await devKey(),p_data:S,p_base_rev:this.rev,p_force:!!force},45000);
      if(sess!==SESS)return;
      if(r&&r.ok){this.rev=r.rev;this.dirty=(this.ver||0)!==ver;this.at=Date.now();this.state=this.dirty?'idle':'ok';await Store.set('jk_rev_'+SESS,this.rev);await Store.set('jk_dirty_'+SESS,this.dirty);await Store.set('jk_at_'+SESS,this.at);if(this.dirty){clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500)}}
      else if(r&&r.conflict){this.state='err';this.err='data di HP lain lebih baru';conflictSheet(r)}
      else{this.state='err';this.err=(r&&r.error)||'gagal'}
    }catch(e){if(e.expired)return sessionEnded(e.message);this.state=e.offline?'offline':'err';this.err=e.message}
    finally{this.busy=false;this.show()}
  }
};

}

    '<label class="f">Nama barang<input type="text" id="oc-name" value="'+esc(x.name)+'" placeholder="Indomie Goreng 85 g" autocomplete="off"'+(n&&!fromSug?' autofocus':'')+'></label>'+
    '<label class="f">Barcode (kosongkan jika tidak ada)<span class="row" style="flex-wrap:nowrap"><input class="grow" type="text" inputmode="numeric" id="oc-code" value="'+esc(x.code||'')+'" autocomplete="off" style="width:auto"><button class="btn" type="button" data-act="oc-scan">'+ico('scan')+'Scan</button><button class="btn" type="button" data-act="oc-off" title="Isi nama dan foto dari Open Food Facts">Isi otomatis</button></span></label>'+
    '<div class="two"><label class="f">Jenis<input type="text" id="oc-cat" list="oc-cats" value="'+esc(x.cat||'')+'" autocomplete="off"><datalist id="oc-cats">'+cats.map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></label>'+
    '<label class="f">Satuan<input type="text" id="oc-unit" value="'+esc(x.unit||'pcs')+'" autocomplete="off"></label></div>'+
    '<label class="f">Harga jual saran<input type="text" inputmode="numeric" data-rp id="oc-price" value="'+(x.price?fmt(x.price):'')+'" placeholder="0" autocomplete="off"></label>'+
    '<p class="offnote" id="oc-offnote"'+(x.off?'':' hidden')+'>Nama dan foto dari Open Food Facts (lisensi terbuka CC BY-SA). Periksa sebelum menyimpan.</p>'+
    '<button class="btn primary block" data-act="oc-save">Simpan ke katalog</button>'+(n?'':'<button class="btn danger block" data-act="oc-del">Hapus dari katalog</button>'));
}
const ST={pending:['Menunggu','warn'],active:['Aktif','ok'],rejected:['Ditolak','bad'],disabled:['Nonaktif','bad']};
function ownerRender(){
  if(OWN.tab==='peta')return ownerMapRender();
  if(OWN.tab!=='akun')return ownerCatRender();
  const L=OWN.list,cnt=k=>L.filter(a=>a.status===k).length,l=L.filter(a=>OWN.f==='semua'||a.status===OWN.f);
  const wa=a=>'https://wa.me/'+a.wa+'?text='+encodeURIComponent(a.status==='active'?'Halo '+a.owner_name+', akun Jaga Kasir untuk '+a.shop_name+' sudah aktif. Masuk di https://jagapatner.my.id/kasir/ dengan nama pengguna: '+a.username:'Halo '+a.owner_name+', ini JAGA tentang pendaftaran Jaga Kasir untuk '+a.shop_name+'.');
  $('#login-root').innerHTML='<div class="own"><header class="top"><div class="logo">'+MARK('mk')+'<b>JAGA</b><span>Pemilik</span></div><div class="shop">Akun warung Jaga Kasir</div><button class="chip" data-act="owner-logout">Keluar</button></header>'+
    '<div class="own-body">'+ownerTabs()+'<div class="row"><h2 class="grow">Akun warung</h2><button class="btn" data-act="owner-refresh">Muat ulang</button><button class="btn" data-act="owner-otp">Verifikasi WhatsApp</button><button class="btn" data-act="owner-mypass">Ganti sandi pemilik</button></div>'+
    '<div class="tiles"><div class="stat"><small>Menunggu persetujuan</small><b class="num" style="color:'+(cnt('pending')?'var(--warn)':'inherit')+'">'+cnt('pending')+'</b></div><div class="stat"><small>Aktif</small><b class="num">'+cnt('active')+'</b></div><div class="stat"><small>Total warung</small><b class="num">'+L.length+'</b></div></div>'+
    (OWN.fun?'<div class="card"><h3 style="margin-bottom:8px">Aktivasi warung</h3><div class="funnel">'+[['Akun aktif',OWN.fun.aktif],['Masuk 7 hari',OWN.fun.masuk_7h],['Pilih dari katalog',(OWN.fun.events||{}).wizard||0],['Barang pertama',(OWN.fun.events||{}).barang_pertama||0],['Transaksi pertama',(OWN.fun.events||{}).transaksi_pertama||0],['10 transaksi',(OWN.fun.events||{}).transaksi_10||0],['Tutup toko',(OWN.fun.events||{}).tutup_toko||0],['Pakai penjaga',(OWN.fun.events||{}).penjaga||0],['Ingatkan kasbon',(OWN.fun.events||{}).kasbon_wa||0]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b class="num">'+(x[1]||0)+'</b></div>').join('')+'</div></div>':'')+
    '<div class="seg">'+[['pending','Menunggu'],['active','Aktif'],['disabled','Nonaktif'],['rejected','Ditolak'],['semua','Semua']].map(f=>'<button data-act="owner-f" data-f="'+f[0]+'" aria-pressed="'+(OWN.f===f[0])+'">'+f[1]+(f[0]!=='semua'&&cnt(f[0])?' · '+cnt(f[0]):'')+'</button>').join('')+'</div>'+
    (l.length?l.map(a=>'<div class="card acc"><div class="row"><b class="grow">'+esc(a.shop_name)+'</b><span class="pill '+ST[a.status][1]+'">'+ST[a.status][0]+'</span></div>'+
      '<div class="small muted">'+esc(a.owner_name)+' · <span class="num">+'+esc(a.wa)+'</span> · pengguna <b>'+esc(a.username)+'</b></div>'+
      (a.address?'<div class="small muted">'+esc(a.address)+'</div>':'')+
      (a.app==='kasir'?'<div class="small">Paket: <b>'+(a.plan==='plus'?'Lifetime Plus':a.plan==='basic'?'Lifetime Basic':(a.trial_until&&Date.parse(a.trial_until)<Date.now()?'Masa coba habis':'Masa coba sampai '+fmtDate(Date.parse(a.trial_until||Date.now()))))+'</b></div>':'')+
      '<div class="small">Lokasi: '+(a.lat!=null?'<a href="'+mapsUrl(a.lat,a.lng)+'" target="_blank" rel="noopener">titik tersimpan</a>':'<span class="muted">belum ditandai</span>')+'</div>'+
      '<div class="small">Perangkat: <b class="num">'+(a.devices||0)+(a.max_devices?' dari '+a.max_devices:'')+'</b>'+(a.max_devices?'':' · tanpa batas')+'</div>'+
      '<div class="small muted">Daftar '+fmtDate(Date.parse(a.created_at))+(a.last_login?' · terakhir masuk '+fmtDate(Date.parse(a.last_login)):'')+(a.backup_at?' · cadangan '+fmtDate(Date.parse(a.backup_at))+' '+fmtTime(Date.parse(a.backup_at)):'')+'</div>'+
      (a.note?'<div class="small">Catatan: '+esc(a.note)+'</div>':'')+
      '<div class="row">'+(a.status!=='active'?'<button class="btn primary" data-act="owner-set" data-id="'+a.id+'" data-s="active">'+(a.status==='pending'?'Setujui':'Aktifkan')+'</button>':'')+
        (a.status==='pending'?'<button class="btn danger" data-act="owner-set" data-id="'+a.id+'" data-s="rejected">Tolak</button>':'')+
        (a.status==='active'?'<button class="btn danger" data-act="owner-set" data-id="'+a.id+'" data-s="disabled">Nonaktifkan</button>':'')+
        '<button class="btn" data-act="owner-plan" data-id="'+a.id+'">Paket</button><button class="btn" data-act="owner-dev" data-id="'+a.id+'">Perangkat</button><button class="btn" data-act="owner-hist" data-id="'+a.id+'">Riwayat cadangan</button><button class="btn" data-act="owner-pass" data-id="'+a.id+'">Atur ulang sandi</button><a class="btn" target="_blank" rel="noopener" href="'+wa(a)+'">WhatsApp</a></div></div>').join(''):
      '<div class="card empty">'+(OWN.f==='pending'?'Tidak ada pendaftaran yang menunggu.':'Tidak ada akun di daftar ini.')+'</div>')+
    '</div></div>';
}

function showLogin(){
  PAY=null;try{if(location.hash)location.hash=''}catch(e){}$('#view').innerHTML='';$('#tabs').innerHTML='';$('#shop-name').textContent='';$('#sheet-root').innerHTML='';
  $('#login-root').innerHTML='<div class="login"><div class="login-card">'+
    '<div class="login-head">'+MARK('mk')+'<div class="word"><b>JAGA</b> Kasir</div><h1>Masuk ke akun warung</h1><p>Kasir warung: scan barang, stok, pembayaran, dan struk.</p></div>'+
    '<div class="lg-ok" id="lg-ok" role="status" hidden></div>'+
    '<label class="f">Nama pengguna<input type="text" id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>'+
    '<label class="f">Kata sandi<input type="password" id="lg-pass" autocomplete="current-password"></label>'+
    '<div class="lg-err" id="lg-err" role="alert"></div>'+
    '<button class="btn pay block" data-act="login" id="lg-btn">Masuk</button>'+
    '<button class="btn block" data-act="to-register">Daftar akun warung baru</button>'+
    '<button class="btn ghost block" data-act="login-local">Coba dulu tanpa daftar</button>'+
    '<div class="lg-foot"><a href="tentang/">Tentang Jaga Kasir</a><a href="privasi/">Privasi</a><a href="syarat/">Syarat</a></div>'+
    (FRAMED?'<p class="muted small" style="margin:0;text-align:center">Mode pratinjau: daftar dan masuk akun warung aktif setelah aplikasi dipasang di situs.</p>':'')+
    '</div></div>';
  setTimeout(()=>{const u=$('#lg-user');if(u&&(!document.activeElement||document.activeElement===document.body))u.focus()},50);
}
async function boot(){
  S=await Store.get(KEY());
  if((!S||!Array.isArray(S.products))&&isAcc()){try{await pullServer()}catch(e){}if(!S||!Array.isArray(S.products)){S=blank();if(ACC){S.shop.name=ACC.shop_name;S.shop.address=ACC.address||''}await Store.set(KEY(),S)}}
  else if(!S||!Array.isArray(S.products)){S=blank();await save()} else S=normalize(S);
  view='kasir'; const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)) view=h;
  q='';kc='';hidePrev=false;rf='semua';
  await loadWho();
  render();
  if(REG_PLAN&&isAcc()){const pl=REG_PLAN;REG_PLAN='';setTimeout(async()=>{try{const r=await rpc('jk_pay_request',{p_key:await devKey(),p_plan:pl});if(r.ok){invoiceSheet(r);sheetClose=()=>{if(!S.products.length&&!S.onb){S.onb=1;save();setTimeout(wizard,200)}}}}catch(e){}},300);return}
  if(!S.demo&&!S.products.length&&!S.onb&&!WHO&&(isAcc()||SESS==='local')){S.onb=1;save();setTimeout(()=>{if(!$('#sheet-root').firstChild&&!$('#login-root').firstChild)wizard()},400)}
}
async function startSession(kind){SESS=kind;await Store.set('jk_session',kind);$('#login-root').innerHTML='';await boot();if(kind==='local'&&S&&!S.trialStart){S.trialStart=Date.now();save();render()}}
(async function(){
  await Store.init();
  if(location.hash==='#pemilik'){
    try{const m=document.createElement('meta');m.name='robots';m.content='noindex';document.head.appendChild(m)}catch(e){}
    OWN.key=await Store.get('jk_owner_key'); if(OWN.key) await ownerOpen(); else showOwnerLogin(); return;
  }
  SESS=await Store.get('jk_session');
  if(/[?&]coba=1/.test(location.search)){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}if(!isAcc()&&SESS!=='local'){SESS='local';await Store.set('jk_session','local')}}
  if(isAcc()){ACC=await Store.get('jk_account_'+SESS);
    if(!ACC){try{const r=await rpc('jk_me',{p_key:await devKey()});if(r&&r.account){ACC=r.account;await Store.set('jk_account_'+SESS,ACC)}}catch(e){if(e.expired){SESS=null;await Store.set('jk_session','')}}}
    if(!ACC){SESS=null;showLogin()}else{await Sync.load();await boot();
      rpc('jk_me',{p_key:await devKey()}).then(r=>{if(r&&r.account){ACC=r.account;Store.set('jk_account_'+SESS,ACC);if(!$('#sheet-root').firstChild)render();if(r.backup_rev>Sync.rev&&!Sync.dirty){pullServer().then(render).catch(()=>{})}else if(Sync.dirty)Sync.push()}})
        .catch(e=>{if(e.expired)sessionEnded('Akun dinonaktifkan atau sesi berakhir. Hubungi JAGA jika perlu.');else{Sync.state=Sync.dirty?'offline':'ok';Sync.show()}})}}
  else if(SESS==='local'){await boot();if(S&&!S.trialStart){S.trialStart=Date.now();save()}}
  else{SESS=null;await Store.set('jk_session','');showLogin()}
  try{if(!FRAMED&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!FRAMED&&'serviceWorker' in navigator&&location.protocol==='https:'){
    const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    const chk=async()=>{try{const t=await (await fetch('sw.js',{cache:'no-store'})).text();const v=(t.match(/VERSION = '([^']+)'/)||[])[1];
      if(v&&v!==APP_VER&&!document.getElementById('upd-bar')){const d=document.createElement('div');d.id='upd-bar';d.className='upd-bar';d.innerHTML='<span>Versi baru Jaga Kasir tersedia.</span><button class="btn pay">Muat ulang</button>';d.querySelector('button').onclick=()=>location.reload();document.body.appendChild(d)}}catch(e){}};
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});setInterval(chk,15*60e3);setTimeout(chk,8000);
  }
})();
</script>
